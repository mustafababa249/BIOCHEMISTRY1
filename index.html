1:{t:["Buffers","المحاليل المنظِّمة"],
en:"Buffers are solutions of a weak acid (HA) and its conjugate base, or a weak base and its conjugate acid.<br>Buffers resist the change in pH because they have acid to neutralize bases and bases to neutralize acids.",
ar:"المحاليل المنظِّمة هي محاليل تتكوّن من حمض ضعيف (HA) وقاعدته المرافقة، أو قاعدة ضعيفة وحمضها المرافق.<br>تقاوم المحاليل المنظِّمة تغيّر الرقم الهيدروجيني (pH) لأنها تحتوي على حمض لمعادلة القواعد وقاعدة لمعادلة الأحماض.",
ex:"المحلول المنظِّم = <b>زوج</b> (حمض + قاعدته المرافقة). إذا أضفنا قاعدة عادلها الحمض، وإذا أضفنا حمضًا عادلته القاعدة، فيبقى pH ثابتًا تقريبًا."},
2:{t:["How buffers resist pH change","كيف تقاوم المحاليل المنظِّمة تغيّر pH"],

3:{t:["Two common ways to produce a buffer","طريقتان شائعتان لتكوين المنظِّم"],

ar:"1. حمض ضعيف + قاعدته المرافقة، مثال: CH<sub>3</sub>COOH / CH<sub>3</sub>COO<sup>−</sup><br>2. قاعدة ضعيفة + حمضها المرافق، مثال: NH<sub>3</sub> / NH<sub>4</sub><sup>+</sup><br>ملاحظة: تحتاج المحاليل المنظِّمة إلى مكوِّن حمضي ومكوِّن قاعدي.",
ex:"CH<sub>3</sub>COOH حمض الأسيتيك (الخليك) وCH<sub>3</sub>COO<sup>−</sup> أيون الأسيتات (قاعدته المرافقة). NH<sub>3</sub> الأمونيا (قاعدة ضعيفة) وNH<sub>4</sub><sup>+</sup> الأمونيوم (حمضها المرافق)."},
4:{t:["The buffer systems of the body","الأنظمة المنظِّمة في الجسم"],
en:"(a) Proteins are the most important buffers in the body. They are mainly intracellular and include haemoglobin.<br>(b) Phosphate buffer (H<sub>2</sub>PO<sub>4</sub><sup>−</sup> : HPO<sub>4</sub><sup>2−</sup>) is mainly intracellular.<br>(c) H<sub>2</sub>CO<sub>3</sub> is a buffer found in the blood (extracellular).<div class='eq'>H<sub>2</sub>CO<sub>3</sub> ⇌ H<sup>+</sup> + HCO<sub>3</sub><sup>−</sup></div>Carbonic acid · bicarbonate ion",
ar:"(أ) البروتينات هي أهم المحاليل المنظِّمة في الجسم، وتوجد أساسًا داخل الخلايا وتشمل الهيموغلوبين.<br>(ب) المنظِّم الفوسفاتي (H<sub>2</sub>PO<sub>4</sub><sup>−</sup> : HPO<sub>4</sub><sup>2−</sup>) داخل الخلايا أساسًا.<br>(ج) حمض الكربونيك H<sub>2</sub>CO<sub>3</sub> منظِّم موجود في الدم (خارج الخلايا).<br>حمض الكربونيك ⇌ أيون الهيدروجين + أيون البيكربونات.",
ex:"احفظ: <b>داخل الخلية</b> = بروتينات (مثل الهيموغلوبين) + فوسفات. <b>خارج الخلية (الدم)</b> = حمض الكربونيك/البيكربونات. السهمان ⇌ يعنيان أن التفاعل عكوس."},
5:{t:["Mechanism of action","آلية عمل المنظِّم"],

ar:"• عند إضافة قاعدة تتفاعل مع البروتونات التي يوفّرها تأيّن الحمض الضعيف.<br>• عند إضافة حمض يتفاعل مع أيون الأسيتات السالب لتكوين حمض غير متأيّن.",
ex:"قاعدة مضافة ← يعطيها الحمض H<sup>+</sup> فتتحول إلى ماء. حمض مضاف ← تلتقط الأسيتات H<sup>+</sup> فتصير CH<sub>3</sub>COOH. النتيجة: لا يتغير pH كثيرًا."},
6:{t:["Buffer capacity","السعة التنظيمية"],
en:"The effectiveness of a buffer, called buffer capacity, depends on:<br>• Buffer concentration (both components)<br>• Ratio of conjugate acid to conjugate base — maximum buffering capacity at a ratio of one, i.e. pH = pK<sub>a</sub>",
ar:"تُسمّى فعالية المحلول المنظِّم السعة التنظيمية، وتعتمد على:<br>• تركيز المنظِّم (كلا المكوّنين).<br>• نسبة الحمض المرافق إلى القاعدة المرافقة؛ وتكون السعة في أقصاها عندما تساوي النسبة واحدًا، أي عند pH = pK<sub>a</sub>.",

7:{t:["Physiological buffers","المحاليل المنظِّمة الفسيولوجية"],

ar:"التوازن الحمضي–القاعدي من المشكلات المهمة في الممارسة السريرية. تركيز H<sup>+</sup> في البلازما والسائل خارج الخلايا 40 نانومول/لتر، أي pH ≈ 7.4 (المدى الطبيعي 7.35–7.45). انخفاض pH دون 7.0 أو ارتفاعه فوق 7.8 قد يؤدي إلى عواقب خطيرة.",
ex:"احفظ الأرقام: <b>7.4</b> طبيعي، <b>7.35–7.45</b> المدى، والخطر تحت <b>7.0</b> وفوق <b>7.8</b>."},
8:{t:["Regulation of blood pH","تنظيم الرقم الهيدروجيني للدم"],

9:{t:["Henderson–Hasselbalch Equation","معادلة هندرسون–هاسلبالخ"],
en:"Henderson-Hasselbalch Equation (title slide).",
ar:"معادلة هندرسون–هاسلبالخ (شريحة عنوان فقط).",
ex:"تبدأ من هنا المعادلة التي تربط pH بنسبة القاعدة إلى الحمض."},
10:{t:["Henderson–Hasselbalch (Buffer) Equation","معادلة هندرسون–هاسلبالخ"],
en:"A modification of the equation for the dissociation of a weak acid.<div class='eq'>pH = pK<sub>a</sub> + log ( [base] / [acid] )</div>Where: pH is the log of the molar concentration of the hydrogen; pK<sub>a</sub> is the equilibrium dissociation constant for an acid; [base] is the molar concentration of the conjugate base; [acid] is the molar concentration of an acidic solution.",
ar:"تعديل لمعادلة تفكّك الحمض الضعيف.<div class='eq'>pH = pK<sub>a</sub> + log ( [القاعدة] / [الحمض] )</div>حيث: pH لوغاريتم تركيز الهيدروجين المولاري؛ pK<sub>a</sub> ثابت تفكّك الحمض عند الاتزان؛ [base] التركيز المولاري للقاعدة المرافقة؛ [acid] التركيز المولاري للحمض.",
ex:"المعادلة الأهم في الفصل. القاعدة في <b>البسط</b> والحمض في <b>المقام</b>. إذا زادت القاعدة ارتفع pH، وإذا زاد الحمض انخفض."},
11:{t:["Calculating pH from acid and conjugate base","حساب pH من الحمض وقاعدته المرافقة"],

ar:"ينبغي أن يكون واضحًا الآن أن pH محلول أي حمض يمكن حسابه بمعرفة تركيز الحمض HA وتركيز قاعدته المرافقة [A<sup>−</sup>].",
ex:"تحتاج فقط: pK<sub>a</sub> + تركيزَي [A<sup>−</sup>] و[HA]."},
12:{t:["When [A⁻] = [HA]","عندما يتساوى الحمض مع قاعدته"],
en:"At the point of the dissociation where the concentration of the conjugate base [A<sup>−</sup>] equals that of the acid [HA]:<div class='eq'>pH = pK<sub>a</sub> + log[1]</div>",
ar:"عند نقطة التفكّك التي يتساوى فيها [A<sup>−</sup>] مع [HA]:<div class='eq'>pH = pK<sub>a</sub> + log[1]</div>",
ex:"النسبة [A<sup>−</sup>]/[HA] = 1 ← لذلك ظهر الرقم 1 داخل اللوغاريتم."},
13:{t:["Relation between pH and pKa","العلاقة بين pH و pKa"],
en:"The log of 1 = 0. Thus, at the mid-point of a titration of a weak acid:<div class='eq'>pK<sub>a</sub> = pH</div>In other words, the term pK<sub>a</sub> is that pH at which an equivalent distribution of acid and conjugate base exists in solution.",

P(17,"Chemical basis of life","الأساس الكيميائي للحياة","Chemical basis of life means: 1. the chemical constituents of living cells and 2. the reactions that they undergo.","الأساس الكيميائي للحياة يعني: 1. المكوّنات الكيميائية للخلايا الحية، 2. التفاعلات التي تخضع لها.","المواد + تفاعلاتها = الكيمياء الحيوية.");
P(18,"Chemical constituents of living cells","المكوّنات الكيميائية للخلايا الحية","Water · Carbohydrates · Lipids · Proteins · Nucleic Acids · Vitamins · Minerals.","الماء · الكربوهيدرات · الدهون · البروتينات · الأحماض النووية · الفيتامينات · المعادن.","سبعة مكوّنات؛ المنهج يشرحها بالترتيب.");
P(19,"Studying molecules","دراسة الجزيئات","To study molecules, biochemists need to: isolate, determine, analyze.","لدراسة الجزيئات يحتاج الكيميائيون الحيويون إلى: العزل (Isolate)، التحديد (Determine)، التحليل (Analyze).","عزل المادة ثم تحديد خصائصها ثم تحليلها.");
P(20,"Importance for life sciences","أهمية الكيمياء الحيوية","Knowledge of biochemistry is essential to all life sciences (biochemistry is their common language): Genetics, Physiology, Immunology, Pharmacology, Pathology, Microbiology, Zoology, Botany.","المعرفة بالكيمياء الحيوية ضرورية لكل علوم الحياة (فهي لغتها المشتركة): الوراثة، وظائف الأعضاء، المناعة، الأدوية، الأمراض، الأحياء الدقيقة، الحيوان، النبات.","ثمانية علوم تعتمد عليها.");

P(23,"The ionization of water","تأيّن الماء","Water is slightly ionized into a hydrogen ion (H<sup>+</sup>) and a hydroxide ion (OH<sup>−</sup>).<div class='eq'>H<sub>2</sub>O ⇌ H<sup>+</sup> + OH<sup>−</sup></div>","يتأين الماء تأينًا طفيفًا إلى أيون هيدروجين (H<sup>+</sup>) وأيون هيدروكسيد (OH<sup>−</sup>).","التأين ضعيف جدًا، لذلك السهمان ⇌.");
P(24,"Extent of ionization","مقدار التأيّن","At room temperature, only about one out of every 10<sup>9</sup> water molecules is ionized at any given time. As a result, pure water consists mostly of H<sub>2</sub>O molecules.","عند درجة حرارة الغرفة يتأين تقريبًا جزيء واحد من كل 10<sup>9</sup> جزيء ماء في أي لحظة، لذلك يتكوّن الماء النقي في معظمه من جزيئات H<sub>2</sub>O.","نسبة ضئيلة جدًا من الجزيئات متأينة.");
P(25,"Concentrations of H⁺ and OH⁻","تركيز H⁺ و OH⁻","At 25°C, water dissociates to the extent that [H<sup>+</sup>] and [OH<sup>−</sup>] are 1×10<sup>−7</sup> M. The concentration of water is a constant (55.5 M).","عند 25°م يتفكك الماء بحيث يكون [H<sup>+</sup>] و[OH<sup>−</sup>] مساويًا 1×10<sup>−7</sup> مولار، وتركيز الماء ثابت (55.5 مولار).","M = مول/لتر.");
P(26,"The equilibrium constant of water","ثابت اتزان الماء","<div class='eq'>K<sub>c</sub> = [H<sub>3</sub>O<sup>+</sup>][OH<sup>−</sup>] / [H<sub>2</sub>O]<sup>2</sup><br>K<sub>c</sub>[H<sub>2</sub>O]<sup>2</sup> = [H<sub>3</sub>O<sup>+</sup>][OH<sup>−</sup>]<br>K<sub>w</sub> = [H<sup>+</sup>][OH<sup>−</sup>] = 1.0×10<sup>−14</sup> (at 25°C)</div>In pure water: [H<sup>+</sup>] = [OH<sup>−</sup>] = 1.0×10<sup>−7</sup>","<div class='eq'>K<sub>w</sub> = [H<sup>+</sup>][OH<sup>−</sup>] = 1.0×10<sup>−14</sup> (عند 25°م)</div>في الماء النقي: [H<sup>+</sup>] = [OH<sup>−</sup>] = 1.0×10<sup>−7</sup>.","K<sub>w</sub> ثابت تأيّن الماء، وهو من أهم الأرقام للحفظ.");
P(27,"Neutral solution","المحلول المتعادل","A solution for which [H<sup>+</sup>] = [OH<sup>−</sup>] is said to be neutral. In most solutions these ions are not equal in concentration. As the concentration of one increases the other must decrease so that their product equals 1.0×10<sup>−14</sup>.","يُقال للمحلول الذي فيه [H<sup>+</sup>] = [OH<sup>−</sup>] إنه متعادل. في معظم المحاليل لا يتساوى الأيونان؛ وكلما زاد أحدهما نقص الآخر ليبقى حاصل ضربهما 1.0×10<sup>−14</sup>.","علاقة عكسية بين H<sup>+</sup> وOH<sup>−</sup>.");
(()=>{let r="";for(let i=0;i<=14;i++){const h=i?"0."+"0".repeat(i-1)+"1":"1",o=(14-i)?"0."+"0".repeat(13-i)+"1":"1";r+=`<tr><td>${i<7?"Acid · حمضي":i==7?"Neutral · متعادل":"Alkaline · قاعدي"}</td><td>${i}</td><td>${i==0?"1":h}</td><td>${i==14?"1":o}</td></tr>`}
P(28,"Ion concentration (mol/L)","تركيز الأيونات (مول/لتر)","<div style='overflow:auto'><table border=1 cellpadding=5 style='border-collapse:collapse;direction:ltr;font-size:13px'><tr><th></th><th>pH</th><th>H<sup>+</sup></th><th>OH<sup>−</sup></th></tr>"+r+"</table></div>","الجدول نفسه: كل زيادة في pH بوحدة تقلّل [H<sup>+</sup>] عشرة أضعاف وتزيد [OH<sup>−</sup>] عشرة أضعاف.","عند pH 7 يتساويان (10<sup>−7</sup>).")})();
P(29,"The concentration of H⁺","تركيز H⁺","The concentration of [H<sup>+</sup>] in an aqueous solution is usually quite small. We therefore express the concentration of hydrogen ions as the negative logarithm of [H<sup>+</sup>].","تركيز [H<sup>+</sup>] في المحلول المائي صغير جدًا، لذلك نعبّر عنه باللوغاريتم السالب لتركيز [H<sup>+</sup>].","هذا هو سبب اختراع مقياس pH.");
P(30,"pH","الرقم الهيدروجيني pH","pH is a shorthand way to know how much H<sup>+</sup> is present in a solution. To avoid the use of large negative exponents, the pH scale was devised. pH is defined as the negative logarithm of the hydrogen ion concentration.<div class='eq'>pH = −log [H<sup>+</sup>]</div>","pH طريقة مختصرة لمعرفة كمية H<sup>+</sup> في المحلول؛ وُضع المقياس لتجنّب الأسس السالبة الكبيرة، ويُعرَّف بأنه اللوغاريتم السالب لتركيز أيونات الهيدروجين.","مثال: [H<sup>+</sup>] = 10<sup>−7</sup> ← pH = 7.");
P(31,"pH scale","مقياس pH","pH scale ranges from 1 to 14. pH of 1–7 is acidic with the smaller number being more acidic. pH of 7–14 is basic with the larger number being more basic. pH 7, the dissociation of water, is neutral.","يمتد المقياس من 1 إلى 14 (حسب الشريحة). القيم 1–7 حمضية (الأصغر أكثر حموضة)، و7–14 قاعدية (الأكبر أكثر قاعدية)، و7 متعادل وهو تأيّن الماء.","<small>ملاحظة تصحيحية (من خارج الشريحة): المقياس يمكن أن يتجاوز هذا المدى، والجدول في ص28 يبدأ من 0.</small>");
P(32,"pH scale: log scale","المقياس اللوغاريتمي","pH = −log [H<sup>+</sup>]. Log scale means 10× change per unit! Examples: pH 1 → [H<sup>+</sup>] = 10<sup>−1</sup> M; pH 9 → [H<sup>+</sup>] = 10<sup>−9</sup> M. (A drawing shows pH of common substances.)","pH = −log[H<sup>+</sup>]. المقياس اللوغاريتمي يعني تغيّر عشرة أضعاف لكل وحدة! أمثلة: pH 1 ← 10<sup>−1</sup> M؛ pH 9 ← 10<sup>−9</sup> M. (رسم يوضح pH لمواد شائعة.)","فرق 3 وحدات = 1000 ضعف. "+D);
P(33,"ACIDS & BASES","الأحماض والقواعد","ACIDS & BASES (title slide).","الأحماض والقواعد (عنوان).","بداية فصل الأحماض والقواعد.");
P(34,"Definition of an acid","تعريف الحمض","An acid is a proton donor.<div class='eq'>HA → H<sup>+</sup> + A<sup>−</sup></div>","الحمض مانح للبروتون. HA الحمض، H<sup>+</sup> البروتون، A<sup>−</sup> القاعدة المرافقة.","الحمض يعطي H<sup>+</sup>.");
P(35,"(Molecular diagram)","(رسم جزيئي)","No text — molecular model with Cl<sup>−</sup>.","لا نص؛ رسم بنموذج كروي يظهر فيه Cl<sup>−</sup>.",D);
P(36,"Strong acids","الأحماض القوية","Strong acids completely ionize in water. Strong acids go 100% to the right. This is an irreversible reaction.<div class='eq'>HCl → H<sup>+</sup> + Cl<sup>−</sup></div>","الأحماض القوية تتأين تأينًا كاملًا في الماء (100% نحو النواتج)، والتفاعل غير عكوس.","مثال: حمض الهيدروكلوريك HCl.");
P(37,"A strong acid (illustration)","حمض قوي (رسم)","When HCl dissolves in water, it ionizes completely. (H<sub>3</sub>O<sup>+</sup> and Cl<sup>−</sup> shown.)","عندما يذوب HCl في الماء يتأين تأينًا كاملًا (يظهر H<sub>3</sub>O<sup>+</sup> وCl<sup>−</sup>).",D);
P(38,"Weak acids","الأحماض الضعيفة","Weak acids do not ionize completely. HF is a weak acid.<div class='eq'>HF ⇌ H<sup>+</sup> + F<sup>−</sup></div>This is a reversible reaction.","الأحماض الضعيفة لا تتأين كاملًا. HF حمض ضعيف. التفاعل عكوس.","الفرق عن القوي: سهم عكوس ⇌.");
P(39,"A weak acid (illustration)","حمض ضعيف (رسم)","When HF dissolves in water, only a fraction of the molecules ionize. (HF, F<sup>−</sup>, H<sub>3</sub>O<sup>+</sup> shown.)","عندما يذوب HF في الماء يتأين جزء فقط من الجزيئات.",D);
P(40,"Definition of a base","تعريف القاعدة","A base is a proton accepter or a hydroxyl donor.<div class='eq'>B + H<sup>+</sup> → BH<sup>+</sup></div>","القاعدة مستقبِل للبروتون أو مانح للهيدروكسيل.","القاعدة تأخذ H<sup>+</sup>.");
P(41,"Strong bases","القواعد القوية","A strong base completely dissociates in solution into the ions that make it up. This is an irreversible reaction.<div class='eq'>NaOH → Na<sup>+</sup> + OH<sup>−</sup></div>","القاعدة القوية تتفكك تمامًا في المحلول إلى أيوناتها، والتفاعل غير عكوس.","مثال: هيدروكسيد الصوديوم.");
P(42,"A strong base (illustration)","قاعدة قوية (رسم)","NaOH dissociates into Na<sup>+</sup> and OH<sup>−</sup>.","تفكك NaOH إلى Na<sup>+</sup> وOH<sup>−</sup>.",D);
P(43,"Weak bases","القواعد الضعيفة","Weak bases do not fully ionize in water. This is a reversible reaction.<div class='eq'>NH<sub>3</sub> + H<sup>+</sup> ⇌ NH<sub>4</sub><sup>+</sup></div>","القواعد الضعيفة لا تتأين كاملًا في الماء، والتفاعل عكوس.","مثال: الأمونيا.");
P(44,"A weak base (illustration)","قاعدة ضعيفة (رسم)","NH<sub>3</sub> in water with NH<sub>4</sub><sup>+</sup> and OH<sup>−</sup> shown.","الأمونيا في الماء مع ظهور NH<sub>4</sub><sup>+</sup> وOH<sup>−</sup>.",D);
P(45,"Ionization constant of acids","ثابت تأيّن الأحماض","HA → H<sup>+</sup> + A<sup>−</sup><div class='eq'>K<sub>a</sub> = [H<sup>+</sup>][A<sup>−</sup>] / [HA]</div>K<sub>a</sub> = measure of ability of an acid to dissociate. Strong acids: high K<sub>a</sub>, ionized 100% in water. Weak acids: low K<sub>a</sub>, ionized partially (~10%) in water.","K<sub>a</sub> مقياس لقدرة الحمض على التفكك. الأحماض القوية: K<sub>a</sub> مرتفع وتتأين 100%. الضعيفة: K<sub>a</sub> منخفض وتتأين جزئيًا (~10%).","كلما زاد K<sub>a</sub> زادت قوة الحمض.");
P(46,"The physiological pH","الرقم الهيدروجيني الفسيولوجي","It is important in the human body that pH remains nearly constant: ~7 inside cells, 7.4 ± 0.05 in blood. This can be achieved by the use of BUFFERS.","من المهم أن يبقى pH ثابتًا تقريبًا في الجسم: ~7 داخل الخلايا، و7.4 ± 0.05 في الدم، ويتحقق ذلك بالمحاليل المنظِّمة.","ربط هذا الفصل بفصل الـBuffers.");

/* الجزء 3: الصفحات 47–76 — كيمياء الكربوهيدرات */
const Q=(n,te,ta,en,ar,ex)=>PAGES[n]={t:[te,ta],en,ar,ex};
Q(47,"Carbohydrates Chemistry","كيمياء الكربوهيدرات","Carbohydrates Chemistry (title slide).","كيمياء الكربوهيدرات (عنوان).","بداية فصل الكربوهيدرات.");
Q(48,"What are carbohydrates?","ممّ تتكوّن الكربوهيدرات؟","Carbohydrates are compounds composed of carbon and hydrates of water.","الكربوهيدرات مركبات تتكوّن من الكربون ومن «هيدرات الماء».","الاسم: كربون + هيدرات (ماء).");
Q(49,"Formula and definition","الصيغة والتعريف","Originally thought to have the formula (CH<sub>2</sub>O)<sub>n</sub>. Now known that only simple monosaccharides obey this rule.<br>Carbohydrate: polyhydroxy aldehyde or ketone, or a larger molecule which can be hydrolyzed to a polyhydroxy aldehyde or ketone.","كان يُعتقد أن صيغتها (CH<sub>2</sub>O)<sub>n</sub>، ومعروف الآن أن السكريات الأحادية البسيطة فقط تتبعها.<br>الكربوهيدرات: ألدهيد أو كيتون متعدد الهيدروكسيل، أو جزيء أكبر يُحلَّل مائيًا إليه.","Polyhydroxy = عدة مجموعات OH. Hydrolysis = تفكيك بالماء.");
Q(50,"Functions 1: energy source","الوظيفة 1: مصدر الطاقة","Energy source for plants and animals. One of the major sources of energy in the cell. 75% of energy in the cell comes from CHO, 25% from others (fats) — this percentage is reversed in the heart. 1 mole CHO = 4 K.calories; 1 mole protein = 3.9 K.calories.","مصدر طاقة للنباتات والحيوانات، ومن المصادر الرئيسية للطاقة في الخلية: 75% من طاقة الخلية من الكربوهيدرات و25% من الدهون وغيرها، وتنعكس النسبة في القلب. 1 مول CHO = 4 كيلو كالوري؛ 1 مول بروتين = 3.9 كيلو كالوري (كما في الشريحة).","<small>ملاحظة تصحيحية: القيمة 4 kcal المعروفة هي لكل <b>جرام</b>، وليست لكل مول.</small>");
Q(51,"Functions 2–3","الوظيفتان 2 و3","2. Cell membrane components, e.g. glycolipids.<br>3. Form structural tissues in plants and in microorganisms, e.g. cellulose, lignin, murein.","2. مكوّنات غشاء الخلية، مثل الدهون السكرية (Glycolipids).<br>3. تكوين الأنسجة الهيكلية في النباتات والكائنات الدقيقة، مثل السليلوز واللجنين والميورين.","أمثلة تُحفظ.");
Q(52,"Functions 4–5","الوظيفتان 4 و5","4. Intermediates in the biosynthesis of other basic biochemical entities (fats and proteins).<br>5. Synthesis of nucleic acids: DNA — deoxyribonucleic acid (deoxy sugar); RNA — ribonucleic acid (ribose sugar).","4. وسائط في التخليق الحيوي لمركبات أخرى (الدهون والبروتينات).<br>5. تصنيع الأحماض النووية: DNA (سكر منقوص الأكسجين) وRNA (سكر الريبوز).","الفرق بين DNA وRNA في نوع السكر.");
Q(53,"Function 6: storage","الوظيفة 6: التخزين","6. Stored as glycogen in animals and starch in plants.<br>Why does the cell store excess glucose as glycogen?","6. تُخزَّن كجليكوجين في الحيوان ونشا في النبات.<br>لماذا تخزّن الخلية الجلوكوز الزائد على هيئة جليكوجين؟","السؤال بلا إجابة في الشريحة.");
Q(54,"Function 7: diseases","الوظيفة 7: الأمراض","7. To describe the mechanism of some diseases related to CHO, e.g. Diabetes Mellitus, Glycogen storage diseases.","7. وصف آلية بعض الأمراض المرتبطة بالكربوهيدرات، مثل داء السكري وأمراض تخزين الجليكوجين.","");
Q(55,"Classification of saccharides: monosaccharides","تصنيف السكريات: الأحادية","1. Monosaccharides: simplest form of saccharides; cannot be hydrolyzed further; most (99%) are straight-chain compounds.<br>D-glyceraldehyde is the simplest of the aldoses (aldotriose). All other sugars end with -ose (glucose, galactose, ribose, lactose…).","1. السكريات الأحادية: أبسط أشكال السكريات، لا تُحلَّل إلى أبسط منها، ومعظمها (99%) مستقيم السلسلة.<br>الجليسرألدهيد D أبسط ألدوز (ألدوتريوز)، وبقية السكريات تنتهي بـ -ose.","Aldose = يحتوي ألدهيد. Triose = 3 كربونات.");
Q(56,"Classification criteria","أسس التصنيف","Classified by: 1. the number of carbon atoms: 3C triose, 4C tetrose, 5C pentose, 6C hexose. 2. the position of the carbonyl group: aldose (terminal), ketose (middle).","يُصنَّف حسب: 1. عدد ذرات الكربون: ثلاثي، رباعي، خماسي، سداسي. 2. موضع مجموعة الكربونيل: ألدوز (طرفية) أو كيتوز (وسطية).","ألدهيد في الطرف، كيتون في الوسط.");
Q(57,"Disaccharides","السكريات الثنائية","Maltose: gives glucose + glucose by maltase; produced during germination of seeds and fermentation.<br>Sucrose: gives glucose + fructose by sucrase; refined from sugarcane and sugar beets.<br>Lactose: gives glucose + galactose by lactase; found in milk (milk sugar).","المالتوز: جلوكوز + جلوكوز بإنزيم المالتيز؛ ينتج أثناء إنبات البذور والتخمر.<br>السكروز: جلوكوز + فركتوز بإنزيم السكريز؛ يُستخلص من القصب وبنجر السكر.<br>اللاكتوز: جلوكوز + جالاكتوز بإنزيم اللاكتيز؛ في الحليب.","<table border=1 cellpadding=4 style='border-collapse:collapse'><tr><td>مالتوز</td><td>Glc+Glc</td></tr><tr><td>سكروز</td><td>Glc+Fru</td></tr><tr><td>لاكتوز</td><td>Glc+Gal</td></tr></table>");
Q(58,"Lactose intolerance (1)","عدم تحمّل اللاكتوز (1)","Symptoms: bloating, abdominal discomfort, and diarrhea.<br>Causes: lactase deficiency.","الأعراض: انتفاخ وانزعاج بطني وإسهال. السبب: نقص إنزيم اللاكتيز.","");
Q(59,"Lactose intolerance (2)","عدم تحمّل اللاكتوز (2)","Prevalence: highest in Southeast Asians; lowest in Northern Europeans.<br>Dietary changes: does not require elimination of milk/milk products; acidophilus milk.","الانتشار: الأعلى عند جنوب شرق آسيا والأقل عند شمال أوروبا. التغذية: لا يتطلب منع الحليب ومنتجاته؛ حليب الأسيدوفيلوس.","");
Q(60,"Oligo- and polysaccharides","قليلة ومتعددة التسكّر","3. Oligosaccharides: hydrolysis gives 3–10 monosaccharides, e.g. maltotriose.<br>4. Polysaccharides: hydrolysis gives more than 10 monosaccharides, e.g. starch, glycogen.","3. قليلة التسكّر: تعطي 3–10 سكريات أحادية، مثل المالتوترايوز. 4. عديدة التسكّر: أكثر من 10، مثل النشا والجليكوجين.","");
Q(61,"More polysaccharides","مزيد من عديدات التسكّر","Inulin, dextrin, cellulose, chitin.","الإينولين، الدكسترين، السليلوز، الكيتين.","تكملة لأمثلة الشريحة السابقة.");
Q(62,"Isomers","المتماكبات","Isomers: organic molecules with the same molecular formula but differing in structure or arrangement of atoms.","المتماكبات: جزيئات عضوية لها نفس الصيغة الجزيئية لكن تختلف في التركيب أو ترتيب الذرات.","");
Q(63,"Stereoisomers","المتماكبات الفراغية","Same molecular formula but different atomic arrangement in space. Example: two C<sub>3</sub> structures, CH<sub>2</sub>OH–CH<sub>2</sub>OH–CH(=O) vs CH<sub>2</sub>OH–CH(=O)–CH<sub>2</sub>OH.","نفس الصيغة الجزيئية لكن ترتيب الذرات في الفراغ مختلف. المثال في الشريحة: تركيبان بثلاث كربونات.","");
Q(64,"Types of isomers: Fischer (D & L)","أنواع: متماكبا D و L","1. Fischer's (L & D isomers): D-glucose and L-glucose drawn as Fischer projections (CHO at the top, CH<sub>2</sub>OH at the bottom, OH/H on each carbon).","1. متماكبات فيشر (D وL): D-جلوكوز وL-جلوكوز بإسقاط فيشر؛ هما صورتان مرآتيتان.","<small>اتجاه OH على الكربون الأبعد عن الألدهيد يحدد D أو L. "+"الرسم في الشريحة.</small>");
Q(65,"D-glucose","D-جلوكوز","Common names: glucose, dextrose. Natural source: fruits, vegetables, corn syrup and honey. Importance: building block for disaccharides (sucrose, lactose, maltose) and polysaccharides (starch, cellulose, glycogen).","الأسماء الشائعة: جلوكوز، دكستروز. المصدر: الفواكه والخضار وشراب الذرة والعسل. الأهمية: لبنة بناء للسكريات الثنائية (سكروز، لاكتوز، مالتوز) والعديدة (نشا، سليلوز، جليكوجين).","");
Q(66,"Glucose diseases","أمراض الجلوكوز","Diseases: hypoglycemia, hyperglycemia.","الأمراض: نقص سكر الدم، ارتفاع سكر الدم.","");
Q(67,"D-galactose","D-جالاكتوز","Natural source: none for free form; formed by hydrolysis of milk lactose. Importance: cellular membranes of brain and nervous system. Deficiency disease: galactosemia — the enzyme to digest galactose is missing and levels build up in blood, causing mental retardation, cataracts and cirrhosis.","المصدر: لا يوجد حرًّا؛ ينتج من تحلّل لاكتوز الحليب. الأهمية: أغشية خلايا الدماغ والجهاز العصبي. مرض النقص: الجالاكتوسيميا — غياب إنزيم هضمه فيتراكم في الدم ويسبب تخلفًا عقليًا وساد العين وتشمّع الكبد.","");
Q(68,"D-fructose","D-فركتوز","Common names: levulose, fruit sugar. Natural source: fruit juice and honey; hydrolysis of sugar. Importance: due to sweetness, used as sugar.","الأسماء: ليفيولوز وسكر الفاكهة. المصدر: عصير الفاكهة والعسل وتحلّل السكر. الأهمية: يُستخدم كمُحلٍّ لحلاوته.","");
Q(69,"Glycosidic bonds","الروابط الجليكوسيدية","A covalent bond between a carbohydrate and another substance containing OH or N.","رابطة تساهمية بين كربوهيدرات ومادة أخرى تحتوي على OH أو N.","");
Q(70,"Glycoside","الجليكوسيد","A glycoside is two substances connected by a glycosidic bond. E.g. digitalis.","الجليكوسيد مادتان مرتبطتان برابطة جليكوسيدية، مثل الديجيتاليس.","");
Q(71,"Homopolysaccharides: starch","النشا","1,4-linked glucose with some 1,6 linkages (branched); a branch every 12–20 Glc residues; digestible by mammals; storage form of energy in plants.","جلوكوز مرتبط 1,4 مع بعض الروابط 1,6 (متفرع)، فرع كل 12–20 جلوكوز؛ يهضمه الثدييات؛ شكل تخزين الطاقة في النبات.","");
Q(72,"Homopolysaccharides: cellulose","السليلوز","Cellulose: β1,4-linked glucose; linear; undigestable by mammals.","السليلوز: جلوكوز مرتبط β1,4، خطي، لا تهضمه الثدييات.","الفرق عن النشا: الرابطة β لا α.");
Q(73,"Digestion (1)","الهضم (1)","Mouth: salivary amylase begins to hydrolyze starch. Stomach: fibers delay gastric emptying and provide a sense of fullness (satiety).","الفم: أميليز اللعاب يبدأ تحلّل النشا. المعدة: الألياف تؤخر إفراغ المعدة وتعطي الشعور بالشبع.","");
Q(74,"Digestion (2)","الهضم (2)","Small intestine: maltase, sucrase, lactase. Pancreas: pancreatic amylase.","الأمعاء الدقيقة: المالتيز والسكريز واللاكتيز. البنكرياس: أميليز البنكرياس.","");
Q(75,"Fibers","الألياف","Large intestine: fibers help attract water and soften stools; fermented by intestinal bacteria, providing short-chain fatty acids that fuel immune cells.","الأمعاء الغليظة: الألياف تجذب الماء وتلين البراز، وتتخمر بالبكتيريا فتنتج أحماضًا دهنية قصيرة السلسلة تغذي الخلايا المناعية.","");
Q(76,"Available vs unavailable carbohydrates","المتاحة وغير المتاحة","Sugars and starches are available because we can break them down and obtain their nutrients. Fibers are unavailable because we cannot break down their bonds.","السكريات والنشا متاحة لأننا نفككها ونستفيد منها؛ الألياف غير متاحة لأننا لا نستطيع كسر روابطها.","");

R(78,"Why do we eat?","لماذا نأكل؟","To get energy and… in these forms: ATP / NADH and FADH<sub>2</sub>.","لنحصل على الطاقة… على هيئة ATP وNADH وFADH<sub>2</sub>.","هذه «عملات الطاقة» في الخلية.");
R(79,"What do we eat?","ماذا نأكل؟","Carbohydrates, proteins, fats.","الكربوهيدرات والبروتينات والدهون.");
R(80,"What happens next?","ماذا يحدث بعد ذلك؟","Digestion → absorption → metabolism. Enzymes: salivary amylase, pancreatic amylase, sucrase, lactase. Uptake of monosaccharides and disaccharides by intestinal mucosal cells.","الهضم ← الامتصاص ← الأيض. الإنزيمات: أميليز اللعاب، أميليز البنكرياس، السكريز، اللاكتيز. تمتص خلايا مخاطية الأمعاء السكريات الأحادية والثنائية.");
R(81,"Metabolism","الأيض","Metabolism: a series of chemical reactions that begins with a particular molecule and converts it into other molecule(s). May be anabolic or catabolic.<br>Catabolism [ends with –lysis]: breakdown/oxidation of molecules to give energy [ATP/NADH/FADH<sub>2</sub>], e.g. glycolysis, lipolysis.<br>Anabolism [ends with –genesis]: synthetic reactions that build up substances and consume energy, e.g. gluconeogenesis, lipogenesis.","الأيض سلسلة تفاعلات تبدأ بجزيء معيّن وتحوّله إلى جزيء/جزيئات أخرى، وقد يكون هدمًا أو بناءً.<br>الهدم (ينتهي بـ lysis): تكسير/أكسدة لإعطاء طاقة، مثل التحلل السكري وتحلل الدهون.<br>البناء (ينتهي بـ genesis): تفاعلات تصنيع تستهلك طاقة، مثل تكوين الجلوكوز الجديد وتكوين الدهون.","lysis = هدم ، genesis = بناء.");

R(86,"Glycolysis: definition & location","التعريف والموقع","Definition: a sequence of 10 reactions that break down one molecule of glucose to 2 molecules of pyruvate [or lactate] to provide energy and intermediates for other metabolic pathways.<br>Location: cytosol of all cells.","تسلسل من 10 تفاعلات يحوّل جزيء جلوكوز واحدًا إلى جزيئي بيروفات [أو لاكتات] لتوفير الطاقة ومواد وسيطة لمسارات أخرى. الموقع: سيتوسول كل الخلايا.");
R(87,"Types of glycolysis","أنواع التحلل السكري","1. Aerobic: requires O<sub>2</sub>; produces 6–8 moles ATP per mole glucose; ends with pyruvate.<br>2. Anaerobic: functions in absence of O<sub>2</sub> [cells with no mitochondria, e.g. RBCs]; produces 2 ATP; ends with lactate.","1. هوائي: يحتاج O<sub>2</sub>، ينتج 6–8 ATP لكل مول جلوكوز، ينتهي بالبيروفات. 2. لاهوائي: في غياب O<sub>2</sub> [خلايا بلا ميتوكوندريا مثل كريات الدم الحمراء]، ينتج 2 ATP وينتهي باللاكتات.");
R(88,"Reactions of glycolysis","تفاعلات التحلل السكري","Two phases. The first 5 reactions = energy investment phase: consumes 2 ATP, ends with 2 triose phosphates [G3P &amp; DHAP]. The subsequent reactions = energy generation phase: produces 4 ATP. 2 NADH are formed when pyruvate is the end product. Net = 2 ATP [4−2] + [4–6] ATP = 6–8 ATP.","مرحلتان: أول 5 تفاعلات = استثمار طاقة (يستهلك 2 ATP وينتهي بتريوزين فوسفاتيين G3P وDHAP). والتفاعلات التالية = توليد طاقة (4 ATP). يتكوّن 2 NADH عند انتهاء المسار بالبيروفات. الصافي = 2 ATP + (4–6) من NADH = 6–8 ATP.");
R(89,"Lactate end-product & irreversible steps","النهاية باللاكتات والتفاعلات غير العكوسة","When lactate is the end product, NADH is reconverted to NAD<sup>+</sup>, i.e. no ATP from NADH; net is 2 ATP only.<br>Three irreversible reactions, catalyzed by: 1. hexokinase [or glucokinase]; 2. phosphofructokinase; 3. pyruvate kinase.","عندما تكون اللاكتات هي الناتج يتحوّل NADH إلى NAD<sup>+</sup> فلا ATP منه، والصافي 2 ATP فقط. ثلاثة تفاعلات غير عكوسة بإنزيمات: الهيكسوكيناز [أو الجلوكوكيناز]، الفوسفوفركتوكيناز، البيروفات كيناز.","احفظ الثلاثة: HK – PFK – PK.");
R(90,"Glycolysis pathway","مسار التحلل السكري","Glucose →(hexokinase/glucokinase, −ATP) G6P →(phosphoglucose isomerase) F6P →(phosphofructokinase, −ATP) F-1,6-BP →(aldolase) G3P + DHAP (triose phosphate isomerase) → 2 × [G3P →(G3P dehydrogenase, NAD<sup>+</sup>→NADH) 1,3-BPG →(phosphoglycerate kinase, +ATP) 3-PG →(mutase) 2-PG →(enolase) PEP →(pyruvate kinase, +ATP) pyruvate] →(lactate dehydrogenase) lactate.","الجلوكوز ← G6P ← F6P ← F-1,6-BP ← G3P + DHAP ← 1,3-BPG ← 3-PG ← 2-PG ← PEP ← بيروفات ← لاكتات، بالإنزيمات المذكورة أعلاه.","مخطط الشريحة نصًّا. "+I);
R(91,"Summary of glycolysis","ملخص التحلل السكري","Summary diagram.","رسم ملخص للتحلل السكري.",I);
R(92,"1. Glucose → Glucose-6-phosphate","1. الجلوكوز ← جلوكوز-6-فوسفات","By phosphorylation glucose is: 1. trapped inside the cell [−ve charge]; 2. activated for subsequent reactions. Irreversible, consumes 1 ATP. Catalyzed by hexokinase [all tissues] or glucokinase [liver only].","بالفسفرة يُحبس الجلوكوز داخل الخلية (شحنة سالبة) ويتنشّط للتفاعلات التالية. تفاعل غير عكوس يستهلك 1 ATP، بإنزيم هيكسوكيناز (كل الأنسجة) أو جلوكوكيناز (الكبد فقط).");
R(93,"Glucokinase","الجلوكوكيناز","Glucokinase increases its synthesis in response to insulin secretion and carbohydrate intake, so its function is to remove glucose from the blood after a meal. Hexokinase is inhibited by its product G6P.","يزداد تصنيع الجلوكوكيناز استجابة للأنسولين وتناول الكربوهيدرات، فوظيفته إزالة الجلوكوز من الدم بعد الوجبة. أما الهيكسوكيناز فيثبّطه ناتجه G6P.");
R(94,"Hexokinase vs. glucokinase","الهيكسوكيناز مقابل الجلوكوكيناز","<table border=1 cellpadding=5 style='border-collapse:collapse'><tr><th>Hexokinase (peripheral tissues)</th><th>Glucokinase (liver)</th></tr><tr><td>Phosphorylates any hexose, e.g. F → F6P</td><td>Specific for glucose</td></tr><tr><td>Inhibited by G6P</td><td>Not inhibited by G6P</td></tr><tr><td>Very low Km (0.1 mM)</td><td>Very high Km (10 mM)</td></tr></table>","<table border=1 cellpadding=5 style='border-collapse:collapse'><tr><th>هيكسوكيناز (الأنسجة الطرفية)</th><th>جلوكوكيناز (الكبد)</th></tr><tr><td>يفسفر أي هكسوز</td><td>خاص بالجلوكوز</td></tr><tr><td>يُثبَّط بـ G6P</td><td>لا يُثبَّط بـ G6P</td></tr><tr><td>Km منخفض جدًا (0.1 mM)</td><td>Km مرتفع جدًا (10 mM)</td></tr></table>","Km منخفض = ألفة عالية للجلوكوز.");
R(95,"2. G6P → F6P","2. G6P ← F6P","Isomerization of glucose 6-phosphate to fructose 6-phosphate, catalyzed by phosphoglucose isomerase. Conversion of an aldose into a ketose.","تماكب G6P إلى F6P بإنزيم فوسفوجلوكوز أيزوميريز: تحويل ألدوز إلى كيتوز.");
R(96,"3. F6P → F-1,6-BP","3. F6P ← F-1,6-BP","Irreversible, consumes 1 ATP. Catalyzed by phosphofructokinase. This is the rate-limiting step of glycolysis (committed/regulatory step).","غير عكوس ويستهلك 1 ATP، بإنزيم فوسفوفركتوكيناز. هي الخطوة المحددة للسرعة (الملتزمة/التنظيمية).","أهم خطوة تنظيمية.");
R(97,"4. Cleavage by aldolase","4. الانشطار بالألدوليز","The 6-carbon sugar is cleaved into two 3-carbon fragments by aldolase: fructose 1,6-bisphosphate → glyceraldehyde 3-phosphate (GAP) + dihydroxyacetone phosphate (DHAP). The remaining steps involve 3-carbon units.","ينشطر السكر السداسي إلى قطعتين ثلاثيتين: F-1,6-BP ← GAP + DHAP. وتتعامل بقية الخطوات مع وحدات ثلاثية الكربون.");
R(98,"5. Triose phosphate isomerase","5. تريوز فوسفات أيزوميريز","G3P is on the direct pathway of glycolysis, whereas DHAP is not. DHAP would be lost unless converted into G3P — done by triose phosphate isomerase.","G3P على المسار المباشر وDHAP ليس كذلك؛ فيُفقد DHAP إلا إذا تحوّل إلى G3P، وهذا ما يفعله الإنزيم.");
R(99,"Energy so far","الطاقة حتى الآن","So far one glucose has become two G3P, no energy has been extracted; on the contrary, 2 ATP have been invested. Now a series of steps harvests energy contained in G3P.","حتى الآن تحوّل جلوكوز إلى جزيئي G3P دون استخلاص طاقة، بل استُثمر 2 ATP. تبدأ الآن خطوات حصاد الطاقة.");
R(100,"6. G3P → 1,3-BPG","6. G3P ← 1,3-BPG","Reversible, catalyzed by G3P dehydrogenase. Gives 1 NADH per mole G3P.","عكوس، بإنزيم G3P ديهيدروجينيز، ويعطي 1 NADH لكل مول G3P.");
R(101,"7. 1,3-BPG → 3-PG","7. 1,3-BPG ← 3-PG","Substrate-level phosphorylation, since 2 ATP are produced directly. Reversible, catalyzed by phosphoglycerate kinase.","فسفرة على مستوى المادة المتفاعلة لأنه ينتج 2 ATP مباشرة؛ عكوس بإنزيم فوسفوجليسرات كيناز.");
R(102,"8. 3-PG → 2-PG","8. 3-PG ← 2-PG","Conversion of 3-phosphoglycerate into 2-phosphoglycerate, catalyzed by phosphoglycerate mutase.","تحويل 3-فوسفوجليسرات إلى 2-فوسفوجليسرات بإنزيم الميوتيز.");
R(103,"9. 2-PG → PEP","9. 2-PG ← PEP","Enolase catalyzes the formation of phosphoenolpyruvate (PEP).","يحفّز الإينوليز تكوين فوسفوإينول بيروفات (PEP).");
R(104,"10. PEP → Pyruvate","10. PEP ← بيروفات","Irreversible, produces 2 ATP, catalyzed by pyruvate kinase. Substrate-level phosphorylation. Activated by AMP; inhibited by ATP and acetyl-CoA.","غير عكوس وينتج 2 ATP بإنزيم بيروفات كيناز، فسفرة مستوى المادة. ينشّطه AMP ويثبّطه ATP وأسيتيل-CoA.");
R(105,"Pyruvate → lactate","البيروفات ← لاكتات","Essential step in anaerobic glycolysis. Converts NADH into NAD<sup>+</sup>, so the NADH produced in reaction 6 is used here. Catalyzed by lactate dehydrogenase. Net production of anaerobic glycolysis is only 2 ATP.","خطوة أساسية في التحلل اللاهوائي: تحوّل NADH إلى NAD<sup>+</sup> فيُستهلك NADH الناتج في التفاعل 6. بإنزيم لاكتات ديهيدروجينيز. الصافي 2 ATP فقط.");

R(107,"Other substrates for glycolysis","مواد أخرى للتحلل السكري","Dietary starch, glycogen, sucrose [table sugar], lactose [milk], fructose [fruits].","النشا الغذائي، الجليكوجين، السكروز [سكر المائدة]، اللاكتوز [الحليب]، الفركتوز [الفواكه].");

R(112,"TCA (tricarboxylic acid) cycle [Krebs cycle]","حلقة حمض الستريك (كريبس)","TCA (tricarboxylic acid) Cycle [Krebs cycle] (title slide).","حلقة TCA [حلقة كريبس] (عنوان).");
R(113,"TCA cycle","حلقة TCA","Oxidizes acetyl-CoA to CO<sub>2</sub>. Occurs in the mitochondrial matrix. Four reducing equivalents per cycle [3 NADH + 1 FADH<sub>2</sub>]. One ATP produced at substrate level. Cannot proceed in the absence of O<sub>2</sub>.","تؤكسد أسيتيل-CoA إلى CO<sub>2</sub>، في مصفوفة الميتوكوندريا. تنتج 4 مكافئات اختزال لكل دورة [3 NADH + 1 FADH<sub>2</sub>] وATP واحدًا على مستوى المادة. لا تسير في غياب O<sub>2</sub>.");
R(114,"TCA: 8 reactions","ثمانية تفاعلات","8 reactions containing condensation, isomerization, decarboxylation and substrate-level phosphorylation. Enzymes: citrate synthase, aconitase, isocitrate DH, α-KG DH, succinate thiokinase, succinate DH, fumarase, malate DH.","8 تفاعلات فيها تكاثف وتماكب ونزع كربوكسيل وفسفرة مستوى المادة. الإنزيمات: سترات سينثيز، أكونيتيز، أيزوسترات DH، α-KG DH، سكسينات ثيوكيناز، سكسينات DH، فيوماريز، ماليت DH.");
R(115,"Characteristics of the TCA cycle","خصائص الحلقة","Final common pathway for oxidation of carbohydrates, lipids and proteins. Major role in gluconeogenesis, transamination [OAA→Asp, α-KG→Glu] and lipogenesis [citrate→lipids]. Energy production [1 ATP, 3 NADH, 1 FADH<sub>2</sub>]. Amphibolic process [catabolic &amp; anabolic].","المسار النهائي المشترك لأكسدة الكربوهيدرات والدهون والبروتينات. لها دور في تكوين الجلوكوز الجديد والنقل الأميني [OAA←Asp، α-KG←Glu] وتكوين الدهون [سترات←دهون]. تنتج طاقة [1 ATP، 3 NADH، 1 FADH<sub>2</sub>]. عملية مزدوجة (هدم وبناء).","Amphibolic = هدم + بناء.");
R(116,"Catabolic and anabolic roles","الدور الهدمي والبنائي","Catabolic: degradation of acetyl-CoA. Anabolic: intermediates are used in synthesis of many compounds.","هدمي: تحطيم أسيتيل-CoA. بنائي: تُستخدم وسائطها في تصنيع مركبات كثيرة.");
R(117,"TCA cycle diagram","مخطط حلقة TCA","Oxaloacetate (4C) → citrate (6C) → isocitrate (6C) → α-ketoglutarate (5C) → succinyl-CoA (4C) → succinate (4C) → fumarate (4C) → malate (4C) → oxaloacetate.","أوكسالوأسيتات (4C) ← سترات (6C) ← أيزوسترات (6C) ← α-كيتوجلوتارات (5C) ← سكسينيل-CoA (4C) ← سكسينات ← فيومارات ← ماليت ← أوكسالوأسيتات.",I);
R(118,"(Image slide)","(شريحة صورة)","No extractable text.","لا نص قابل للاستخراج.",I);
R(119,"Overall energy flow","مخطط الطاقة الإجمالي","Glucose (cytosol) → 2 pyruvate [2 ATP, 2 NADH] → (mitochondria) 2 acetyl-CoA [2 NADH, 2 CO<sub>2</sub>] → TCA cycle [6 NADH + 2 FADH<sub>2</sub>, 2 ATP, 4 CO<sub>2</sub>].","جلوكوز (سيتوسول) ← 2 بيروفات [2 ATP، 2 NADH] ← (ميتوكوندريا) 2 أسيتيل-CoA [2 NADH، 2 CO<sub>2</sub>] ← حلقة TCA [6 NADH + 2 FADH<sub>2</sub>، 2 ATP، 4 CO<sub>2</sub>].",I);
R(120,"Electron transport chain / respiratory chain","سلسلة نقل الإلكترون","Location: inner mitochondrial membrane. 1 NADH gives 3 ATP. 1 FADH<sub>2</sub> gives 2 ATP. The 2 NADH produced by glycolysis [cytosol] must enter the mitochondria to give ATP.","الموقع: الغشاء الداخلي للميتوكوندريا. 1 NADH يعطي 3 ATP، و1 FADH<sub>2</sub> يعطي 2 ATP. يجب أن يدخل 2 NADH الناتجان من التحلل السكري (السيتوسول) إلى الميتوكوندريا ليعطيا ATP.");
R(121,"TCA cycle energy","طاقة حلقة TCA","Gives 3 NADH, 1 FADH<sub>2</sub> and 1 GTP: 12 ATP per cycle. 3 NADH = 9 ATP [3×3]; 1 FADH<sub>2</sub> = 2 ATP; 1 ATP at substrate level. For 1 glucose the cycle turns twice.","تعطي 3 NADH و1 FADH<sub>2</sub> و1 GTP: 12 ATP لكل دورة. 3 NADH = 9 ATP، و1 FADH<sub>2</sub> = 2 ATP، و1 ATP على مستوى المادة. لكل جلوكوز تدور الحلقة مرتين.");
R(122,"Total ATP from one glucose","مجموع ATP من جلوكوز واحد","<div class='eq'>4 + 4 + 24 + [6 or 4] = 38 or 36</div>(same energy-flow diagram as slide 119)","<div class='eq'>4 + 4 + 24 + [6 أو 4] = 38 أو 36</div>(نفس مخطط الشريحة 119).","القيمة 6 أو 4 تتعلق بطريقة دخول NADH السيتوسولي للميتوكوندريا.");

S(124,"Glycogen structure","تركيب الجليكوجين","Glycogen is a highly branched polysaccharide consisting of a polymer of glucose linked together by α1→4 glycosidic bonds in the chains and α1→6 glycosidic bonds at the branch points.","الجليكوجين عديد سكر شديد التفرع، بوليمر من الجلوكوز مرتبط برابطة α1→4 في السلاسل ورابطة α1→6 عند نقاط التفرع.","α1,4 = سلسلة ، α1,6 = تفرع.");
S(125,"Glycogen storage and function","تخزين الجليكوجين ووظيفته","Glycogen is stored in the liver (6% of its weight) and muscle (1% of its weight). Liver glycogen maintains the normal blood glucose level between meals. Muscle glycogen provides energy within the muscle during exercise.","يُخزَّن في الكبد (6% من وزنه) والعضلات (1%). جليكوجين الكبد يحافظ على سكر الدم بين الوجبات، وجليكوجين العضلات يمد العضلة بالطاقة أثناء الرياضة.");
S(126,"Glycogenesis","تكوين الجليكوجين","Definition: synthesis of glycogen. Physiological condition: well-fed state. Tissues: liver and muscle. Subcellular location: cytosol.","التعريف: تصنيع الجليكوجين. الحالة: الشبع. الأنسجة: الكبد والعضلات. الموقع: السيتوسول.");
S(127,"Sequence and requirements","التسلسل والمتطلبات","Glycogenesis starts with glucose and ends with glycogen. Requirements: 1) UDP-glucose (activated glucose); 2) glycogen primer; 3) enzymes: (a) glycogen synthase, the major enzyme establishing α1-4 bonds; (b) branching enzyme, establishing α1-6 bonds.","يبدأ بالجلوكوز وينتهي بالجليكوجين. المتطلبات: 1) UDP-جلوكوز (جلوكوز منشَّط)؛ 2) بادئ جليكوجين؛ 3) الإنزيمات: (أ) جليكوجين سينثيز الإنزيم الرئيسي لروابط α1-4؛ (ب) إنزيم التفرع لروابط α1-6.");
S(128,"Glycogenin and branching enzyme","الجليكوجينين وإنزيم التفرع","Glycogenin is a protein that catalyzes attachment of glucose molecules (forms a primer). Branching enzyme introduces branch points (α1-6): after every 11 glucose residues, it transfers about 6 glucose residues to the neighboring chain, establishing a branch.","الجليكوجينين بروتين يحفّز ربط جزيئات الجلوكوز (يكوّن البادئ). وإنزيم التفرع يُدخل نقاط التفرع (α1-6): بعد كل 11 جلوكوز ينقل نحو 6 جلوكوز إلى السلسلة المجاورة فيتكوّن فرع.");
N(129);N(130);N(131);
S(132,"Regulation of glycogenesis","تنظيم تكوين الجليكوجين","Regulation depends on the activity of glycogen synthase, under hormonal control. Insulin turns on glycogen synthesis through its (−) effect on cAMP. Glucagon and epinephrine turn it off through their (+) effect on cAMP.","يعتمد التنظيم على نشاط جليكوجين سينثيز بتحكم هرموني: الأنسولين يشغّل التصنيع بتأثيره (−) على cAMP، والجلوكاجون والإبينفرين يوقفانه بتأثيرهما (+) على cAMP.");
S(133,"Glycogen synthase a and b","الجليكوجين سينثيز a وb","<table border=1 cellpadding=5 style='border-collapse:collapse'><tr><th>Key enzyme</th><th>Active (a)</th><th>Inactive (b)</th></tr><tr><td>Glycogen synthase</td><td>−OH, dephosphorylated</td><td>−P, phosphorylated</td></tr></table>","<table border=1 cellpadding=5 style='border-collapse:collapse'><tr><th>الإنزيم</th><th>نشط (a)</th><th>غير نشط (b)</th></tr><tr><td>جليكوجين سينثيز</td><td>منزوع الفوسفات</td><td>مفسفر</td></tr></table>","السينثيز: الفسفرة تُوقفه.");
S(134,"Glycogenolysis","تحلل الجليكوجين","Definition: degradation of glycogen during the fasting state (12–18 h) in the liver, or in exercising muscle. Subcellular location: cytosol.","التعريف: هدم الجليكوجين أثناء الصيام (12–18 ساعة) في الكبد أو في العضلة أثناء التمرين. الموقع: السيتوسول.");
S(135,"Importance of glycogenolysis","أهمية تحلل الجليكوجين","Liver glycogen: regulation of blood glucose between meals. Muscle glycogen: a ready source of glucose within the muscle for energy.","جليكوجين الكبد: تنظيم سكر الدم بين الوجبات. جليكوجين العضلة: مصدر جلوكوز جاهز داخل العضلة للطاقة.");
S(136,"Reaction of glycogenolysis","تفاعل تحلل الجليكوجين","Glycogenolysis starts from glycogen and ends with glucose.","يبدأ من الجليكوجين وينتهي بالجلوكوز.");
S(137,"Glycogen phosphorylase","جليكوجين فوسفوريليز","Breaks α1-4 bonds releasing glucose-1-phosphate. Requires PLP. Its activity stops when the chain is four glucose residues from the branch point.","يكسر روابط α1-4 محرّرًا جلوكوز-1-فوسفات، ويحتاج PLP، ويتوقف نشاطه عند بقاء أربع وحدات جلوكوز من نقطة التفرع.");
S(138,"2. Debranching enzyme","2. إنزيم إزالة التفرع","Two activities: glucotransferase transfers a trisaccharide to the neighboring chain, exposing the branch point; glucosidase breaks the α1-6 bond at the branch point releasing free glucose.","له نشاطان: ناقل الجلوكوز ينقل ثلاثي سكر إلى السلسلة المجاورة فيكشف نقطة التفرع، وإنزيم الجلوكوزيداز يكسر رابطة α1-6 فيحرّر جلوكوزًا حرًّا.");
S(139,"Liver pathway","مسار الكبد","Glycogen →(glycogen phosphorylase, Pi) glucose-1-P →(phosphoglucomutase) glucose-6-P →(glucose-6-phosphatase) glucose.","جليكوجين ← جلوكوز-1-فوسفات ← جلوكوز-6-فوسفات ← جلوكوز حر (بوجود G6Pase)، فيستطيع الكبد إطلاق الجلوكوز في الدم.");
S(140,"Muscle pathway","مسار العضلة","Glycogen → glucose-1-P → glucose-6-P → glycolysis → pyruvate. The G6Pase step is absent (X).","جليكوجين ← G1P ← G6P ← التحلل السكري ← بيروفات؛ وخطوة G6Pase غائبة.");
S(141,"Glucose-6-phosphatase","جلوكوز-6-فوسفاتيز","An enzyme present in liver and kidney cells, responsible for releasing free glucose (G6P → glucose). NOT found in muscle cells.","إنزيم موجود في خلايا الكبد والكلى يحرّر الجلوكوز الحر، وغير موجود في العضلات.","لهذا لا تعطي العضلة جلوكوزًا للدم.");
S(142,"Regulation of glycogenolysis","تنظيم تحلل الجليكوجين","Depends on glycogen phosphorylase under hormonal control. Glucagon / epinephrine (cAMP cascade) turn on degradation through their (+) effect on cAMP. Insulin turns it off through its (−) effect on cAMP.","يعتمد على جليكوجين فوسفوريليز: الجلوكاجون/الإبينفرين (سلسلة cAMP) يشغّلان الهدم بتأثير (+)، والأنسولين يوقفه بتأثير (−).");
S(143,"Glycogen storage diseases (glycogenosis)","أمراض تخزين الجليكوجين","A group of inherited disorders arising from a defect in the enzymes of glycogen metabolism. Characterized by deposition of an abnormal type or quantity of glycogen in tissues, or failure to mobilize glycogen.","مجموعة اضطرابات وراثية ناتجة عن خلل في إنزيمات أيض الجليكوجين، تتميز بترسّب جليكوجين غير طبيعي نوعًا أو كمية في الأنسجة، أو بفشل تعبئته.");
N(144);
S(145,"Thanks","شكرًا","Thanks.","شكرًا.");
S(146,"Lipids: structure and function","الدهون: التركيب والوظيفة","Lipids — structure and function (title slide).","الدهون — التركيب والوظيفة (عنوان).");
S(147,"Introduction","مقدمة","A heterogeneous group of compounds related by physical rather than chemical properties. Hydrophobic because of hydrocarbon chains. Relatively insoluble in water; soluble in nonpolar solvents such as benzene and ether.","مجموعة غير متجانسة ترتبط بخصائصها الفيزيائية لا الكيميائية. كارهة للماء بسبب سلاسل الهيدروكربون، قليلة الذوبان في الماء وتذوب في المذيبات غير القطبية كالبنزين والإيثر.");
S(148,"Functions of lipids","وظائف الدهون","1. Structural components of membranes. 2. Storage form of energy. 3. Transporters of metabolic fuel. 4. Emulsifying agents. 5. Vitamins and hormones. 6. Electrical insulator. 7. Thermal insulator.","1. مكوّنات هيكلية للأغشية. 2. شكل لتخزين الطاقة. 3. نقل الوقود الأيضي. 4. عوامل استحلاب. 5. فيتامينات وهرمونات. 6. عازل كهربائي. 7. عازل حراري.");
S(149,"Lipid classification","تصنيف الدهون","1. Simple lipids: esters of fatty acids with various alcohols, e.g. fats and waxes.<br>2. Complex lipids: esters of fatty acids containing groups in addition to alcohol and fatty acid, e.g. phospholipids.<br>3. Precursor and derived lipids: fatty acids, glycerol, ketone bodies, steroids, etc.","1. بسيطة: إسترات أحماض دهنية مع كحولات، مثل الدهون والشموع. 2. معقدة: إسترات تحتوي مجموعات إضافية، مثل الفوسفوليبيدات. 3. مشتقة/سابقة: أحماض دهنية، جلسرول، أجسام كيتونية، ستيرويدات…");
S(150,"Triacylglycerols (TAG)","ثلاثي الأسيل جلسرول","Structure: glycerol + 3 fatty acids; the hydroxyl groups at C-1, C-2, C-3 of glycerol are esterified to the carboxyl groups of the fatty acids. Function: fatty acids are converted to TAG for 1) transport between tissues, 2) storage in adipose tissue. Lipolysis: hydrolysis of TAG into free glycerol and free fatty acids.","التركيب: جلسرول + 3 أحماض دهنية بروابط إستر. الوظيفة: تتحول الأحماض الدهنية إلى TAG للنقل بين الأنسجة والتخزين في النسيج الدهني. تحلل الدهون: تحلل TAG إلى جلسرول حر وأحماض دهنية حرة.");
S(151,"Fat = glycerol + three fatty acids","الدهن = جلسرول + ثلاثة أحماض دهنية","Fats are made of one glycerol and three fatty acids.","تتكوّن الدهون من جلسرول واحد وثلاثة أحماض دهنية.",J);
N(152);
S(153,"Fatty acids","الأحماض الدهنية","Saturated or unsaturated long-chain hydrocarbons with a carboxyl group at one end and a methyl group at the other. Most have an even number of carbons in humans (16, 18, 20). Amphipathic (polar –COOH and nonpolar CH<sub>3</sub> ends). Saturated fatty acids have no double bonds, e.g. palmitic acid (16 C). General formula CH<sub>3</sub>-(CH<sub>2</sub>)<sub>n</sub>-COOH; for palmitic acid n = 14.","سلاسل هيدروكربونية طويلة مشبعة أو غير مشبعة، في طرف كربوكسيل وفي الآخر ميثيل. أغلبها بعدد زوجي من الكربونات (16، 18، 20). ذات طبيعة مزدوجة (أمفيباثية). المشبعة بلا روابط مزدوجة مثل البالمتيك (16C)، صيغتها CH<sub>3</sub>-(CH<sub>2</sub>)<sub>n</sub>-COOH وn = 14 للبالمتيك.");
N(154);
S(155,"Amphipathic","ذو طبيعة مزدوجة","CH<sub>3</sub>-(CH<sub>2</sub>)<sub>n</sub>-COOH: hydrophobic hydrocarbon chain; hydrophilic carboxyl group.","السلسلة الهيدروكربونية كارهة للماء ومجموعة الكربوكسيل محبة للماء.");
S(156,"Fatty acid numbering","ترقيم الأحماض الدهنية","CH<sub>3</sub>-(CH<sub>2</sub>)<sub>n</sub>-CH<sub>2</sub>-CH<sub>2</sub>-COOH: carbon 1 = carboxyl, α = C2, β = C3, ω = terminal methyl.","يبدأ الترقيم من الكربوكسيل (C1)، ثم α (C2) وβ (C3)، وω هي الميثيل الطرفية.");
S(157,"Unsaturated fatty acids","الأحماض الدهنية غير المشبعة","Have one or more double bonds, e.g. linoleic acid (18 C, 2 double bonds), designated 18:2 Δ9,12 (number of carbons : number of double bonds, Δ position of double bonds).","فيها رابطة مزدوجة أو أكثر، مثل اللينوليك (18C وبرابطتين) ويُكتب 18:2 Δ9,12 (عدد الكربونات : عدد الروابط، ومواضعها).");
N(158);
S(159,"Melting point","درجة الانصهار","The melting point of a fatty acid increases with chain length and decreases with the degree of unsaturation. Lipids with lower melting point are more fluid at body temperature and contribute to the fluidity of cell membranes.","ترتفع درجة انصهار الحمض الدهني بزيادة طول السلسلة وتنخفض بزيادة عدم التشبع. والدهون الأقل انصهارًا أكثر سيولة عند حرارة الجسم وتسهم في سيولة الأغشية.");
S(160,"Essential fatty acids","الأحماض الدهنية الأساسية","Essential: must be obtained from the diet, e.g. linoleic and linolenic acids. Nonessential: can be synthesized in our bodies.","الأساسية: يجب الحصول عليها من الغذاء مثل اللينوليك واللينولينيك. غير الأساسية: يصنّعها الجسم.");
S(161,"Triacylglycerol (diagram)","ثلاثي الأسيل جلسرول (رسم)","Glycerol bound to three fatty acids.","جلسرول مرتبط بثلاثة أحماض دهنية.",J);
S(162,"Phospholipids","الفوسفوليبيدات","Components of cellular membranes. Amphipathic. Made of 2 fatty acids + alcohol + phosphate group (P) + X (head group). In glycerophospholipids the alcohol is glycerol; in sphingophospholipids it is sphingosine.","مكوّنات الأغشية الخلوية، أمفيباثية. تتكوّن من حمضين دهنيين + كحول + مجموعة فوسفات + مجموعة رأس X. الكحول في الجلسروفوسفوليبيد جلسرول، وفي السفنجوفوسفوليبيد سفنجوزين.");
S(163,"Glycerophospholipid","الجلسروفوسفوليبيد","The hydroxyls at C-1 and C-2 of glycerol are esterified to 2 fatty acids; the hydroxyl at C-3 is esterified to phosphoric acid. Fatty acids form the hydrophobic portion; the rest of the molecule is hydrophilic.","الهيدروكسيلان في C-1 وC-2 يتأسترا مع حمضين دهنيين، وفي C-3 مع حمض الفوسفوريك. الأحماض الدهنية الجزء الكاره للماء وباقي الجزيء محب للماء.");
S(164,"Glycerophospholipid (diagram)","الجلسروفوسفوليبيد (رسم)","Glycerol + 2 fatty acids + phosphate + head group.","جلسرول + حمضان دهنيان + فوسفات + مجموعة رأس.",J);
N(165);N(166);N(167);N(168);
S(169,"Ceramide","السيراميد","The amino group of sphingosine can form an amide bond with a fatty acid carboxyl, to yield a ceramide. Ceramides usually include a polar head group esterified to the terminal OH of sphingosine.","مجموعة أمين السفنجوزين تكوّن رابطة أميد مع كربوكسيل حمض دهني فتعطي سيراميد، وغالبًا تُؤستر مجموعة رأس قطبية مع OH الطرفية للسفنجوزين.");
S(170,"Glycolipids","الدهون السكرية","Found in every tissue of the body (nervous). Contain ceramide [sphingosine + fatty acid] and one or more sugars, e.g. glucosylceramide and galactosylceramide.","توجد في كل أنسجة الجسم (العصبي). تحتوي سيراميد [سفنجوزين + حمض دهني] وسكرًا أو أكثر، مثل الجلوكوزيل سيراميد والجالاكتوزيل سيراميد.");

const M=n=>T(n,"(Image slide)","(شريحة صورة)","No extractable text.","لا نص قابل للاستخراج.",K);
T(171,"Ketone bodies","الأجسام الكيتونية","Include acetoacetate, β-hydroxybutyrate and acetone. Formed from fatty acids and carbohydrates.","تشمل الأسيتوأسيتات وβ-هيدروكسي بيوتيرات والأسيتون. تتكوّن من الأحماض الدهنية والكربوهيدرات.");
T(172,"Ketone bodies: synthesis","تخليق الأجسام الكيتونية","Synthesized by the liver, but the liver does not use them as a source of energy. Synthesis is high during fasting, starvation and untreated diabetes.","يصنّعها الكبد لكنه لا يستخدمها مصدرًا للطاقة. يزداد تخليقها في الصيام والمجاعة والسكري غير المعالج.");
T(173,"Ketoacidosis","الحماض الكيتوني","Ketoacidosis: imbalance of blood pH caused by excessive production of acetoacetate and β-hydroxybutyrate, which are weak acids. Ketonemia: high blood levels of ketone bodies. Ketonuria: high urine levels.","الحماض الكيتوني: اختلال pH الدم بسبب فرط إنتاج الأسيتوأسيتات وβ-هيدروكسي بيوتيرات (حمضان ضعيفان). الكيتونيميا: ارتفاعها في الدم. الكيتونيوريا: ارتفاعها في البول.");
T(174,"Cholesterol","الكوليسترول","A structural component of cell membranes and plasma lipoproteins. A precursor for steroid hormones, vitamin D and bile acids. Associated with atherosclerosis [coronary artery disease].","مكوّن هيكلي للأغشية والبروتينات الدهنية في البلازما، وسلف للهرمونات الستيرويدية وفيتامين D والأحماض الصفراوية. يرتبط بتصلّب الشرايين [أمراض الشرايين التاجية].");
M(175);
T(176,"Lipoproteins","البروتينات الدهنية","To be transported in blood, lipids must combine with water-soluble compounds such as phospholipids and proteins to make a lipoprotein. A typical lipoprotein has a lipid core of TAG and cholesteryl ester surrounded by a single surface layer of amphipathic phospholipid and cholesterol. The protein portion is apolipoprotein (apoprotein).","لنقل الدهون في الدم لا بد أن تتحد بمركبات ذائبة في الماء كالفوسفوليبيدات والبروتينات لتكوّن بروتينًا دهنيًا. لب دهني من TAG وإستر الكوليسترول يحيط به غلاف من فوسفوليبيد وكوليسترول. الجزء البروتيني يسمى أبوليبوبروتين.");
M(177);
T(178,"Functions of lipoproteins","وظائف البروتينات الدهنية","1. Package dietary and endogenously synthesized lipids. 2. Transport water-insoluble lipids in the circulation. 3. Provide apolipoproteins that have various functions.","1. تغليف الدهون الغذائية والمصنّعة داخليًا. 2. نقل الدهون غير الذائبة في الماء في الدوران. 3. توفير أبوليبوبروتينات ذات وظائف متنوعة.");
T(179,"Classification of lipoproteins","تصنيف البروتينات الدهنية","Classified by density into 5 classes: HDL, LDL, IDL, VLDL, chylomicron.","تُصنَّف حسب الكثافة إلى 5 فئات: HDL وLDL وIDL وVLDL والكيلوميكرون.");
T(180,"Density and protein content","الكثافة ومحتوى البروتين","Density increases as protein content increases: Chylomicron &lt; VLDL &lt; LDL &lt; IDL &lt; HDL.","تزداد الكثافة بزيادة محتوى البروتين: كيلوميكرون &lt; VLDL &lt; LDL &lt; IDL &lt; HDL.");
T(181,"Density vs size","الكثافة والحجم","Chylomicron: low density, large. … HDL: high density, small.","الكيلوميكرون: كثافة منخفضة وحجم كبير … HDL: كثافة عالية وحجم صغير.","كلما زادت الكثافة صغر الحجم.");
M(182);
T(183,"Chylomicron","الكيلوميكرون","Transports exogenous [dietary] TAG and cholesterol from the intestine to other tissues.","ينقل TAG والكوليسترول الغذائيين (الخارجيين) من الأمعاء إلى الأنسجة.");
T(184,"VLDL","VLDL","Transports endogenous [internally produced] TAG and cholesterol from the liver to other tissues.","ينقل TAG والكوليسترول الداخليين من الكبد إلى الأنسجة.");
T(185,"LDL","LDL","Transports cholesterol from the liver to the tissues. Positive correlation between atherosclerosis and plasma LDL cholesterol. High LDL causes hypercholesterolemia. Known as bad cholesterol.","ينقل الكوليسترول من الكبد إلى الأنسجة. علاقة طردية بين تصلّب الشرايين وكوليسترول LDL، وارتفاعه يسبب فرط كوليسترول الدم. يُعرف بالكوليسترول «الضار».");
T(186,"HDL","HDL","Returns excess cholesterol from the tissues to the liver, acting as a scavenger. A high HDL/LDL ratio is believed to be good because it protects against atherosclerosis. Known as good cholesterol.","يعيد فائض الكوليسترول من الأنسجة إلى الكبد (كاسح). ارتفاع نسبة HDL/LDL مفيد لأنه يحمي من تصلّب الشرايين. يُعرف بالكوليسترول «النافع».");
T(187,"Lipid classification chart","مخطط تصنيف الدهون","Simple: fats, waxes. Complex: phospholipids, glycolipids, sulfolipids, aminolipids, lipoproteins. Derived: fatty acids, glycerol, steroids, fatty aldehydes, ketone bodies, lipid-soluble vitamins.","بسيطة: دهون وشموع. معقدة: فوسفوليبيدات، دهون سكرية، سلفوليبيدات، أمينوليبيدات، بروتينات دهنية. مشتقة: أحماض دهنية، جلسرول، ستيرويدات، ألدهيدات دهنية، أجسام كيتونية، فيتامينات ذائبة في الدهون.");
T(188,"Digestion and absorption of lipids","هضم الدهون وامتصاصها","Digestion and absorption of lipids (title slide).","هضم الدهون وامتصاصها (عنوان).");
T(189,"Digestion and absorption of lipid","هضم الدهون وامتصاصها","Title slide (digestive system diagram).","شريحة عنوان (رسم الجهاز الهضمي).",K);
T(190,"Lipid digestion and absorption","هضم الدهون وامتصاصها","Dietary lipids are mainly TAG, with some phospholipids, cholesterol, cholesteryl esters and fat-soluble vitamins. There is lingual lipase but it is not very important for digestion in humans.","الدهون الغذائية أغلبها TAG مع بعض الفوسفوليبيدات والكوليسترول وإسترات الكوليسترول والفيتامينات الذائبة في الدهون. يوجد ليبيز لساني لكنه غير مهم في هضم الإنسان.");
T(191,"In the stomach","في المعدة","Heat has some effect on liquefying dietary lipids. The stomach secretes gastric lipase, which hydrolyzes TAG containing short-, medium- and long-chain fatty acids into free fatty acids and 1,2-diacylglycerol.","للحرارة أثر في تسييل الدهون. تفرز المعدة ليبيزًا معديًا يحلل TAG إلى أحماض دهنية حرة و1,2-ثنائي أسيل جلسرول.");
T(192,"Neonates","حديثو الولادة","Lingual and gastric lipases are important in neonates due to immaturity of pancreatic lipase.","الليبيز اللساني والمعدي مهمان لحديثي الولادة بسبب عدم نضج ليبيز البنكرياس.");
T(193,"In the duodenum","في الاثني عشر","Bile and pancreatic juice arrive through the common bile duct. Bile salts emulsify fats and help digestion and absorption. Emulsification increases the surface of lipid droplets so digestive enzymes act effectively.","تصل الصفراء وعصارة البنكرياس عبر القناة الصفراوية المشتركة. الأملاح الصفراوية تستحلب الدهون، والاستحلاب يزيد مساحة سطح القطرات فتعمل الإنزيمات بفعالية.");
T(194,"Digestive enzymes","الإنزيمات الهاضمة","TAG →(pancreatic lipase + colipase) monoacylglycerol + 2 FA. Cholesteryl ester →(esterase) cholesterol + FA. Phospholipid →(phospholipase A<sub>2</sub>) FA + lysophospholipid.","TAG ← ليبيز البنكرياس + كوليباز ← أحادي أسيل جلسرول + 2 حمض دهني. إستر الكوليسترول ← إستريز ← كوليسترول + حمض دهني. فوسفوليبيد ← فوسفوليبيز A<sub>2</sub> ← حمض دهني + ليزوفوسفوليبيد.");
T(195,"Absorption of lipid","امتصاص الدهون","Free fatty acids, free cholesterol and monoacylglycerol are the primary products.","النواتج الأولية: أحماض دهنية حرة، كوليسترول حر، وأحادي أسيل جلسرول.");
T(196,"Resynthesis and transport","إعادة التصنيع والنقل","TAG and cholesteryl ester are resynthesized in the intestinal mucosa by acyltransferases. Short- and medium-chain fatty acids enter the portal vein and are carried on plasma protein to the liver. TAG, long-chain FA, CE and phospholipids enter the lymphatic system carried by chylomicrons, then to blood, then to the liver.","يُعاد تصنيع TAG وإستر الكوليسترول في مخاطية الأمعاء بإنزيمات أسيل ترانسفيريز. الأحماض قصيرة ومتوسطة السلسلة تدخل الوريد البابي وتُحمل على بروتين البلازما إلى الكبد. أما TAG والأحماض طويلة السلسلة وإسترات الكوليسترول والفوسفوليبيدات فتدخل الجهاز اللمفاوي في كيلوميكرونات ثم الدم ثم الكبد.");
T(197,"Lipid malabsorption","سوء امتصاص الدهون","Malabsorption resulting in loss of lipid, including fat-soluble vitamins and essential fatty acids, in the feces (steatorrhoea). Can be caused by a number of conditions.","سوء امتصاص يؤدي إلى فقد الدهون (بما فيها الفيتامينات الذائبة في الدهون والأحماض الدهنية الأساسية) في البراز (إسهال دهني). له أسباب عدة.");
T(198,"Fatty acid synthesis (lipogenesis)","تخليق الأحماض الدهنية","Fatty Acid Synthesis (lipogenesis) (title slide).","تخليق الأحماض الدهنية (عنوان).");
T(199,"Lipogenesis","تكوين الدهون","Lipogenesis is synthesis of fatty acid from acetyl-CoA.","تكوين الدهون هو تصنيع الحمض الدهني من أسيتيل-CoA.");
T(200,"Source of acetyl-CoA","مصدر أسيتيل-CoA","Acetyl-CoA comes from excess fuels in the fed state, mainly glucose. Occurs in the cytosol, mainly in liver and adipose tissue, also kidney, mammary glands, brain and lungs.","يأتي من الوقود الزائد في حالة الشبع وأساسًا الجلوكوز. يحدث في السيتوسول وبالأخص الكبد والنسيج الدهني، وكذلك الكلى والغدد الثديية والدماغ والرئتان.");
T(201,"Requirements for lipogenesis","متطلبات التخليق","NADPH (from the pentose phosphate pathway and the malic enzyme reaction), and ATP, biotin, Mn<sup>2+</sup>, HCO<sub>3</sub><sup>−</sup>.","NADPH (من مسار البنتوز فوسفات وتفاعل إنزيم الماليك)، وكذلك ATP والبيوتين وMn<sup>2+</sup> وHCO<sub>3</sub><sup>−</sup>.");
T(202,"Acetyl-CoA transport","نقل أسيتيل-CoA","Acetyl-CoA is produced from pyruvate in the mitochondria and transported to the cytosol as citrate, because the TCA cycle is blocked in the fed state by high ATP levels.","يتكوّن أسيتيل-CoA من البيروفات في الميتوكوندريا وينتقل إلى السيتوسول على هيئة سترات، لأن حلقة TCA تتعطل في حالة الشبع بسبب ارتفاع ATP.");
T(203,"Citrate lyase","سترات ليياز","Citrate + CoA + ATP →(citrate lyase) oxaloacetate + acetyl-CoA + ADP + Pi.","سترات + CoA + ATP ← (سترات ليياز) ← أوكسالوأسيتات + أسيتيل-CoA + ADP + Pi.");
T(204,"β-Oxidation of fatty acids","أكسدة بيتا للأحماض الدهنية","Beta Oxidation of Fatty Acids (title slide).","أكسدة بيتا للأحماض الدهنية (عنوان).");
T(205,"What is β-oxidation?","ما هي أكسدة بيتا؟","Oxidation of fatty acids that occurs in the mitochondrial matrix.","أكسدة الأحماض الدهنية التي تحدث في مصفوفة الميتوكوندريا.");
M(206);
T(207,"β-oxidation vs synthesis","أكسدة بيتا مقابل التخليق","Fatty acids are both oxidized to acetyl-CoA and synthesized from acetyl-CoA, but β-oxidation 1) is not the simple reverse of biosynthesis but an entirely different process, 2) takes place in a separate compartment of the cell.","تُؤكسد الأحماض الدهنية إلى أسيتيل-CoA وتُصنَّع منه، لكن أكسدة بيتا ليست عكس التخليق بل عملية مختلفة تمامًا وتحدث في حيّز خلوي مستقل.");
T(208,"β-oxidation properties","خصائص أكسدة بيتا","An aerobic process requiring oxygen. Occurs in the mitochondrial matrix. Uses NAD<sup>+</sup> and FAD as coenzymes. Generates ATP.","عملية هوائية تحتاج الأكسجين، في مصفوفة الميتوكوندريا، تستخدم NAD<sup>+</sup> وFAD كمرافقات إنزيمية، وتولّد ATP.");
T(209,"Increased fatty acid oxidation","زيادة أكسدة الأحماض الدهنية","Occurs in: 1. starvation; 2. uncontrolled diabetes mellitus, leading to ketone body production by the liver (ketosis, ketoacidosis).","تزداد في: 1. المجاعة؛ 2. السكري غير المضبوط مما يؤدي إلى إنتاج الكبد أجسامًا كيتونية (كيتوزية، حماض كيتوني).");
T(210,"Step 1: activation","الخطوة 1: التنشيط","Fatty acids are activated to acyl-CoA then transported across the mitochondrial membrane to the matrix. Activation in the cytosol: in the presence of ATP and CoA, acyl-CoA synthetase (thiokinase) converts a fatty acid to an active fatty acid, acyl-CoA.","تُنشَّط الأحماض الدهنية إلى أسيل-CoA ثم تُنقل عبر غشاء الميتوكوندريا إلى المصفوفة. التنشيط في السيتوسول: بوجود ATP وCoA يحوّل إنزيم أسيل-CoA سينثيتيز (ثيوكيناز) الحمض الدهني إلى أسيل-CoA.");
M(211);
T(212,"Step 2: transport into mitochondria","الخطوة 2: النقل إلى الميتوكوندريا","Long-chain fatty acids cross the inner mitochondrial membrane as carnitine derivatives.","تعبر الأحماض الدهنية طويلة السلسلة الغشاء الداخلي للميتوكوندريا على هيئة مشتقات الكارنيتين.");
T(213,"Two carbons at a time","كربونان في كل مرة","In β-oxidation two carbons at a time are cleaved from acyl-CoA, starting at the carboxyl end. The chain is broken between the α(2)- and β(3)-carbon atoms — hence the name.","في أكسدة بيتا يُقطع كربونان في كل مرة من أسيل-CoA بدءًا من طرف الكربوكسيل، ويحدث الكسر بين الكربونين α(2) وβ(3) ومنه الاسم.");
T(214,"Acetyl-CoA output","ناتج أسيتيل-CoA","The two-carbon units formed are acetyl-CoA; thus palmitoyl-CoA forms eight acetyl-CoA molecules.","الوحدات ثنائية الكربون هي أسيتيل-CoA؛ فيعطي بالميتويل-CoA ثمانية جزيئات أسيتيل-CoA.");
T(215,"Steps of β-oxidation","خطوات أكسدة بيتا","Oxidation → Hydration → Oxidation → Cleavage.","أكسدة ← إماهة ← أكسدة ← انشطار.","أربع خطوات تتكرر.");
M(216);
T(217,"Energy from β-oxidation","الطاقة الناتجة","In the respiratory chain: FADH<sub>2</sub> and NADH = 5 ATP per cycle (7 cycles) = 35 ATP. 8 acetyl-CoA (palmitic acid) = 12 ATP × 8 = 96 ATP. 2 ATP used in activation. 35 + 96 = 131 − 2 = <b>129 ATP (net)</b>.","في السلسلة التنفسية: FADH<sub>2</sub> وNADH = 5 ATP لكل دورة (7 دورات) = 35 ATP. 8 أسيتيل-CoA (حمض البالمتيك) = 12 × 8 = 96 ATP. يُطرح 2 ATP للتنشيط. 35 + 96 = 131 − 2 = <b>129 ATP صافي</b>.");
T(218,"Odd-chain fatty acids","الأحماض الدهنية فردية الكربون","Oxidized by β-oxidation producing acetyl-CoA until a three-carbon residue (propionyl-CoA) remains, which is converted to succinyl-CoA, a member of the TCA cycle.","تُؤكسد بأكسدة بيتا فتعطي أسيتيل-CoA حتى يتبقى بقايا ثلاثية الكربون (بروبيونيل-CoA) تتحول إلى سكسينيل-CoA وهو من حلقة TCA.");

U(219,"Protein Metabolism","أيض البروتينات","Protein Metabolism (title slide).","أيض البروتينات (عنوان).");
U(220,"Nitrogen balance","التوازن النيتروجيني","Nitrogen balance is a comparison between nitrogen intake and nitrogen output.<br>1. Nitrogen equilibrium: intake = output; normal in adults.<br>2. Positive balance: intake &gt; output, e.g. growth and pregnancy.<br>3. Negative balance: intake &lt; output, e.g. infection, healing and malnutrition.","التوازن النيتروجيني مقارنة بين النيتروجين الداخل والخارج. 1. اتزان: الداخل = الخارج (الطبيعي للبالغ). 2. موجب: الداخل &gt; الخارج مثل النمو والحمل. 3. سالب: الداخل &lt; الخارج مثل العدوى والالتئام وسوء التغذية.");
U(221,"Digestion and absorption of proteins","هضم البروتينات وامتصاصها","Degradation of dietary proteins is catalyzed by proteases, produced by the stomach, pancreas and small intestine. They are synthesized as inactive zymogens (proenzymes) activated by cleavage of certain peptide bonds. Trypsin is a common activator of all pancreatic zymogens. After digestion amino acids are absorbed by the intestine and transported through the circulation to other tissues.","يحفّز تحلل البروتينات الغذائية إنزيمات البروتيز المنتجة في المعدة والبنكرياس والأمعاء الدقيقة، وتُصنَّع كزيموجينات غير نشطة تُنشَّط بقطع روابط ببتيدية معينة. التربسين منشّط مشترك لكل زيموجينات البنكرياس. بعد الهضم تُمتص الأحماض الأمينية وتنتقل بالدم إلى الأنسجة.");
U(222,"Phases of amino acid catabolism","مراحل هدم الأحماض الأمينية","Phases of AA catabolism (diagram).","مراحل هدم الأحماض الأمينية (رسم).",V);
W(223);
U(224,"Biosynthesis of urea","تخليق اليوريا","Occurs in 4 stages: 1. Transamination. 2. Deamination. 3. Ammonia transport. 4. Urea cycle.","يحدث في 4 مراحل: 1. النقل الأميني. 2. نزع الأمين. 3. نقل الأمونيا. 4. دورة اليوريا.");
U(225,"1. Transamination","1. النقل الأميني","Definition: transfer of the amino group from an α-amino acid to an α-keto acid to form a new α-amino acid and a new α-keto acid. Function: synthesis and breakdown of amino acids. Requires pyridoxal phosphate (PLP). Reversible. All amino acids except lysine, threonine, proline and hydroxyproline participate. Each transaminase is specific for one pair of substrates but nonspecific for the other pair.","التعريف: نقل مجموعة أمين من حمض α-أميني إلى حمض α-كيتوني لتكوين حمض α-أميني وα-كيتوني جديدين. الوظيفة: تصنيع الأحماض الأمينية وهدمها. يحتاج PLP كمرافق، وعكوس. تشارك كل الأحماض الأمينية عدا الليسين والثريونين والبرولين والهيدروكسي برولين. كل ترانسأميناز نوعي لزوج من المواد ولا نوعي للزوج الآخر.","PLP مشتق من فيتامين B6.");
U(226,"1. Transamination (diagram)","1. النقل الأميني (رسم)","Transamination reaction diagram.","رسم تفاعل النقل الأميني.",V);
W(227);
U(228,"Importance of transamination","أهمية النقل الأميني","Funnels the α-amino groups of different amino acids to α-ketoglutarate to form glutamate. Glutamate is a major amino acid that undergoes oxidative deamination. The α-keto acids (carbon skeletons) can be oxidized for energy or enter gluconeogenesis (glycogenic) or ketogenesis (ketogenic). ALT and AST are used in diagnosis of heart and liver disease.","يجمع مجموعات α-أمين من أحماض مختلفة على α-كيتوجلوتارات لتكوين الجلوتامات، وهو حمض رئيسي يخضع لنزع الأمين التأكسدي. الهياكل الكربونية تُؤكسد للطاقة أو تدخل تكوين الجلوكوز (جليكوجينية) أو تكوين الكيتونات (كيتونية). يُستعمل ALT وAST في تشخيص أمراض القلب والكبد.");
U(229,"2. Oxidative deamination","2. نزع الأمين التأكسدي","Transamination is followed by oxidative deamination. The enzyme is glutamate dehydrogenase (GDH): releases free ammonia from glutamate; occurs in liver mitochondria; reversible; needs NAD<sup>+</sup> or NADP<sup>+</sup>. Regulated by allosteric inhibitors ATP, GTP, NADH and activators ADP, GDP.","يتبع النقل الأميني نزع الأمين التأكسدي بإنزيم جلوتامات ديهيدروجينيز (GDH) الذي يحرّر الأمونيا الحرة من الجلوتامات، في ميتوكوندريا الكبد، عكوس، ويحتاج NAD<sup>+</sup> أو NADP<sup>+</sup>. تثبّطه ألوستيريًا ATP وGTP وNADH وتنشّطه ADP وGDP.");
U(230,"Oxidative deamination (diagram)","نزع الأمين التأكسدي (رسم)","Glutamate → α-ketoglutarate + NH<sub>3</sub>.","جلوتامات ← α-كيتوجلوتارات + NH<sub>3</sub>.",V);
W(231);
U(232,"3. Ammonia transport","3. نقل الأمونيا","Muscle transports nitrogen to the liver as alanine (glucose-alanine cycle). Other tissues transport nitrogen to the liver as glutamine by glutamine synthetase (needs ATP). Glutamine synthetase plays a major role in ammonia detoxification.","تنقل العضلة النيتروجين إلى الكبد على هيئة ألانين (دورة الجلوكوز-ألانين). وتنقله الأنسجة الأخرى على هيئة جلوتامين بإنزيم جلوتامين سينثيتيز (يحتاج ATP) الذي له دور رئيسي في إزالة سمية الأمونيا.");
U(233,"Glucose–alanine cycle","دورة الجلوكوز–ألانين","Muscle: glucose → glycolysis → pyruvate → transamination with α-amino acids → alanine → blood → liver: alanine → pyruvate → gluconeogenesis → glucose → blood → muscle. (© H. Kh. Atif)","العضلة: جلوكوز ← بيروفات ← ألانين (بالنقل الأميني) ← الدم ← الكبد: ألانين ← بيروفات ← تكوين الجلوكوز ← الدم ← العضلة.",V);
U(234,"Glutamine synthesis","تكوين الجلوتامين","Formation of glutamine from glutamate and ammonia by glutamine synthetase (ATP-dependent).","يتكوّن الجلوتامين من الجلوتامات والأمونيا بإنزيم جلوتامين سينثيتيز (يعتمد على ATP).");
U(235,"Glutamine synthesis and degradation","تكوين الجلوتامين وتحلله","Glutamine Synthesis &amp; Degradation (title slide).","تكوين الجلوتامين وتحلله (عنوان).");
W(236);
U(237,"4. Urea cycle","4. دورة اليوريا","Urea synthesis is a cyclic process. Tissue: liver. Site: partially mitochondrial, partially cytosolic. Function: converts toxic ammonia to urea for excretion. Ammonia is toxic to the brain because it reacts with α-ketoglutarate to form glutamate; the result is depletion of α-ketoglutarate, impairing the citric acid cycle (energy ↓), and depletion of the neurotransmitter GABA — neurotoxic effects.","تخليق اليوريا عملية دائرية في الكبد، جزء منها في الميتوكوندريا وجزء في السيتوسول، وظيفتها تحويل الأمونيا السامة إلى يوريا للإخراج. الأمونيا سامة للدماغ لأنها تتفاعل مع α-كيتوجلوتارات فتكوّن جلوتامات، فينخفض α-كيتوجلوتارات ويختل دوران حمض الستريك (انخفاض الطاقة) وينخفض ناقل GABA فتظهر آثار سمية عصبية.");
U(238,"Reaction 1: carbamoyl phosphate","التفاعل 1: كارباموئيل فوسفات","Mitochondrial carbamoyl phosphate synthetase 1 (CPS1) is the rate-limiting enzyme of the urea cycle. 1 mol of carbamoyl phosphate requires 2 mol ATP. CPS1 is activated by N-acetylglutamate.","كارباموئيل فوسفات سينثيتيز 1 (CPS1) الميتوكوندري هو الإنزيم المحدد لسرعة دورة اليوريا. كل مول كارباموئيل فوسفات يحتاج 2 ATP، وينشّط CPS1 مركب N-أسيتيل جلوتامات.");
U(239,"2. Formation of citrulline","2. تكوين السترولين","Carbamoyl phosphate + ornithine → citrulline, by L-ornithine transcarbamoylase.","كارباموئيل فوسفات + أورنيثين ← سترولين بإنزيم أورنيثين ترانسكارباموئيليز.");
U(240,"3. Formation of argininosuccinate","3. تكوين أرجينينوسكسينات","Aspartate provides the second nitrogen of urea.","يوفّر الأسبارتات ذرة النيتروجين الثانية في اليوريا.");
U(241,"4. Cleavage of argininosuccinate","4. انشطار أرجينينوسكسينات","Argininosuccinate is cleaved (reaction diagram).","انشطار أرجينينوسكسينات (رسم التفاعل).",V);
U(242,"5. Cleavage of arginine","5. انشطار الأرجينين","Cleavage of arginine releases urea. Ornithine re-enters further rounds of urea synthesis. Ornithine and lysine are potent inhibitors of arginase and compete with arginine. Urea is excreted in urine through the kidney.","انشطار الأرجينين يحرّر اليوريا، ويعود الأورنيثين لجولات جديدة. الأورنيثين والليسين مثبّطان قويان للأرجيناز ينافسان الأرجينين. تُخرَج اليوريا بالبول عبر الكلى.");
W(243);
U(244,"Urea cycle disorders","اضطرابات دورة اليوريا","Result from a defect in one of the enzymes of urea synthesis. Ammonia intoxication is most severe when the block occurs at reaction 1 or 2. Symptoms: vomiting, irritability, lethargy and severe mental retardation.","تنتج عن خلل في أحد إنزيمات تخليق اليوريا. التسمم بالأمونيا أشد ما يكون عند الخلل في التفاعل 1 أو 2. الأعراض: قيء وتهيّج وخمول وتخلف عقلي شديد.");
U(245,"Urea cycle disorders: table","جدول اضطرابات دورة اليوريا","<table border=1 cellpadding=4 style='border-collapse:collapse;font-size:13px'><tr><th>#</th><th>Defect</th><th>Accumulation</th><th>Disease</th><th>Note</th></tr><tr><td>1</td><td>Carbamoyl phosphate synthetase 1</td><td>Hyperammonemia</td><td>Hyperammonemia type 1</td><td>Rare</td></tr><tr><td>2</td><td>Ornithine transcarbamoylase</td><td>Hyperammonemia, glutamine</td><td>Hyperammonemia type 2</td><td>X-linked</td></tr><tr><td>3</td><td>Argininosuccinate synthetase</td><td>Citrullinemia</td><td>—</td><td>Recessive</td></tr><tr><td>4</td><td>Argininosuccinase</td><td>Argininosuccinate</td><td>Argininosuccinic aciduria</td><td>Recessive</td></tr><tr><td>5</td><td>Arginase</td><td>Arginine</td><td>Hyperargininemia</td><td>Autosomal recessive</td></tr><tr><td>6</td><td>Ornithine transporter</td><td>Hyperornithinemia, hyperammonemia, homocitrullinemia</td><td>HHH syndrome</td><td></td></tr></table>","نفس الجدول: 1) نقص CPS1 ← فرط أمونيا النوع 1 (نادر). 2) نقص OTC ← فرط أمونيا النوع 2 (مرتبط بالكروموسوم X). 3) نقص أرجينينوسكسينات سينثيتيز ← السترولينيميا (متنحٍّ). 4) نقص أرجينينوسكسينيز ← بيلة أرجينينوسكسينية (متنحٍّ). 5) نقص الأرجيناز ← فرط الأرجينين (جسمي متنحٍّ). 6) خلل ناقل الأورنيثين ← متلازمة HHH.","<small>ترتيب الأعمدة مأخوذ من نص الشريحة؛ راجع الشريحة الأصلية للتأكد.</small>");
U(246,"Catabolism of carbon skeletons of amino acids","هدم الهياكل الكربونية للأحماض الأمينية","Catabolism of the Carbon Skeletons of Amino Acids (title slide).","هدم الهياكل الكربونية للأحماض الأمينية (عنوان).");
U(247,"The amphibolic intermediates","المركبات الوسيطة المزدوجة","<table border=1 cellpadding=5 style='border-collapse:collapse'><tr><th>Glycogenic &amp; ketogenic</th><th>Ketogenic (fat)</th><th>Glycogenic (glycogen)</th></tr><tr><td>Isoleucine, Tryptophan, Phenylalanine, Tyrosine, Threonine</td><td>Leucine, Lysine</td><td>Alanine, Cysteine, Glycine, Serine, Asparagine, Aspartate, Methionine, Valine, Arginine, Glutamate, Glutamine</td></tr></table>","<table border=1 cellpadding=5 style='border-collapse:collapse'><tr><th>جليكوجينية وكيتونية</th><th>كيتونية (دهون)</th><th>جليكوجينية (جلوكوز)</th></tr><tr><td>أيزوليوسين، تريبتوفان، فينيل ألانين، تيروزين، ثريونين</td><td>ليوسين، ليسين</td><td>ألانين، سيستين، جلايسين، سيرين، أسباراجين، أسبارتات، ميثيونين، فالين، أرجينين، جلوتامات، جلوتامين</td></tr></table>","الكيتونية فقط: ليوسين وليسين.");

</script>
<script>
const $=s=>document.querySelector(s);
const ls={get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=ls.get('lang','both'),ch=+ls.get('ch',1),q='',done=JSON.parse(ls.get('done','{}'));
document.documentElement.dataset.theme=ls.get('theme','light');
function mark(){document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang))}
function nav(){$('#nav').innerHTML=TOC.map(c=>{const n=Object.keys(PAGES).filter(p=>p>=c[4]&&p<=c[5]).length;return`<button data-c="${c[0]}" class="${c[0]===ch?'on':''}">${c[1]} ${c[3]}<small>${c[2]} · ص ${c[4]}–${c[5]} · ${n?'✔ '+n+' / '+(c[5]-c[4]+1):'⏳'}</small></button>`}).join('')}
function card(p){const d=PAGES[p],t=d?d.t:['Slide '+p,'الشريحة '+p];
let h=`<div class="card" id="p${p}"><div class="ch"><span class="pg">${p}</span><h3>${lang==='en'?t[0]:lang==='ar'?t[1]:t[0]+' — '+t[1]}</h3><label><input type="checkbox" data-d="${p}" ${done[p]?'checked':''}> ✅ تمت</label></div><div class="bd">`;
if(d){if(lang!=='ar')h+=`<div class="en"><span class="lbl">ENGLISH</span>${d.en}</div>`;
if(lang!=='en')h+=`<div class="ar"><span class="lbl">الترجمة</span>${d.ar}</div><div class="ex"><span class="lbl">💡 الشرح</span>${d.ex}</div>`}
else h+=`<div class="soon">⏳ ترجمة هذه الشريحة تُضاف في الجزء التالي — الشريحة الأصلية متاحة أدناه.</div>`;
return h+`<div class="img"><button class="ib" data-i="${p}">🖼 الشريحة الأصلية</button></div></div></div>`}
function render(){mark();nav();const c=TOC.find(x=>x[0]===ch);let ps=[];
if(q){ps=Object.keys(PAGES).map(Number).filter(p=>JSON.stringify(PAGES[p]).toLowerCase().includes(q))}else for(let p=c[4];p<=c[5];p++)ps.push(p);
const tot=Object.keys(PAGES).length,dn=Object.values(done).filter(Boolean).length;
$('#main').innerHTML=`<div class="hero"><h2>${q?'🔍 نتائج البحث ('+ps.length+')':c[1]+' '+c[3]}</h2><div>${q?'':c[2]+' · الصفحات '+c[4]+'–'+c[5]}</div><div style="font-size:13px;margin-top:6px">تقدّمك: ${dn} صفحة مراجَعة · ${tot} / 247 مترجمة</div><div class="bar"><i style="width:${dn/2.47}%"></i></div></div>`+ps.map(card).join('')}
document.addEventListener('click',e=>{const t=e.target;
if(t.closest('[data-l]')){lang=t.closest('[data-l]').dataset.l;ls.set('lang',lang);render()}
else if(t.closest('#nav button')){ch=+t.closest('#nav button').dataset.c;ls.set('ch',ch);q='';$('#q').value='';render();scrollTo(0,0)}
else if(t.dataset.i){const b=t.parentNode;if(b.querySelector('img'))b.querySelector('img').remove();else{b.insertAdjacentHTML('beforeend',`<img loading="lazy" src="p${t.dataset.i}.jpg" onerror="this.onerror=null;this.src='img/p${t.dataset.i}.jpg'" alt="slide ${t.dataset.i}">`)}}
else if(t.matches('.img img')){$('#lb img').src=t.src;$('#lb').style.display='flex'}
else if(t.closest('#lb'))$('#lb').style.display='none';
else if(t.id==='th'){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;ls.set('theme',n)}});
document.addEventListener('change',e=>{if(e.target.dataset.d){done[e.target.dataset.d]=e.target.checked;ls.set('done',JSON.stringify(done));render()}});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render()});
render();
</script>
</body>
</html>
